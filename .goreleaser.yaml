# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# The CLI's release files and packages (.deb, .rpm, the AUR's) for Linux
# (docs/development.md, "Releases"), with the free GoReleaser. It runs in
# the image packaging/Dockerfile builds (packaging/run.sh): `task
# build:clients` makes everything into dist/clients without publishing;
# `task release:clients` adds it to the release semrel made and publishes
# the AUR package. The server is released as container images only.
version: 2

project_name: notekpr-cli
dist: dist/clients

before:
  hooks:
    # The shell completion scripts the archives and packages ship.
    - packaging/completions.sh target-release/completions

# Snapshots are named like the images: the last release, the commits since
# and the commit (0.8.0-3-gabc1234).
snapshot:
  version_template: '{{ trimprefix .Summary "v" }}'

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: linux
    builder: rust
    binary: notekpr
    flags: [--release, --locked, --package=notekpr-cli]
    env: ["NOTEKPR_VERSION={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
    # glibc 2.28 and newer: Debian 10, Ubuntu 20.04, RHEL 8 and later.
    targets:
      - x86_64-unknown-linux-gnu.2.28
      - aarch64-unknown-linux-gnu.2.28

archives:
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: target-release/completions/*
        dst: completions
        strip_parent: true
      - src: packaging/systemd/notekpr-sync@.service
        strip_parent: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# Installed straight from the release (no package repository yet: they don't
# update themselves). `task test:packages` installs them in Debian and in
# AlmaLinux 8 (glibc 2.28, the oldest the builds run on) and runs them.
nfpms:
  - id: packages
    ids: [linux]
    package_name: notekpr-cli
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: coolapso
    homepage: https://github.com/coolapso/notekpr
    maintainer: coolapso <c4s@coolapso.sh>
    description: |-
      The notekpr command-line client: end-to-end encrypted, local-first
      Markdown notes. Keeps an encrypted copy of your vaults, syncs them live
      and can keep them as a folder of Markdown files for any editor.
    license: AGPL-3.0-or-later
    section: utils
    formats: [deb, rpm]
    bindir: /usr/bin
    # What the builds link against (builds.linux.targets).
    overrides:
      deb:
        dependencies: ["libc6 (>= 2.28)"]
      rpm:
        dependencies: ["glibc >= 2.28"]
    contents:
      - src: target-release/completions/notekpr.bash
        dst: /usr/share/bash-completion/completions/notekpr
      - src: target-release/completions/notekpr.fish
        dst: /usr/share/fish/vendor_completions.d/notekpr.fish
      # Each family's own place for zsh completions.
      - src: target-release/completions/_notekpr
        dst: /usr/share/zsh/vendor-completions/_notekpr
        packager: deb
      - src: target-release/completions/_notekpr
        dst: /usr/share/zsh/site-functions/_notekpr
        packager: rpm
      - src: packaging/systemd/notekpr-sync@.service
        dst: /usr/lib/systemd/user/notekpr-sync@.service
      - src: LICENSE
        dst: /usr/share/doc/notekpr-cli/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/notekpr-cli/LICENSE
        packager: rpm

aurs:
  - name: notekpr-cli-bin
    ids: [linux]
    homepage: https://github.com/coolapso/notekpr
    description: Command-line client for notekpr, end-to-end encrypted Markdown notes
    maintainers: ["coolapso <c4s@coolapso.sh>"]
    license: AGPL-3.0-or-later
    provides: [notekpr-cli]
    conflicts: [notekpr-cli]
    depends: [glibc]
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/notekpr-cli-bin.git
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    package: |-
      install -Dm755 notekpr "$pkgdir/usr/bin/notekpr"
      install -Dm644 LICENSE "$pkgdir/usr/share/licenses/notekpr-cli/LICENSE"
      install -Dm644 completions/notekpr.bash "$pkgdir/usr/share/bash-completion/completions/notekpr"
      install -Dm644 completions/_notekpr "$pkgdir/usr/share/zsh/site-functions/_notekpr"
      install -Dm644 completions/notekpr.fish "$pkgdir/usr/share/fish/vendor_completions.d/notekpr.fish"
      install -Dm644 notekpr-sync@.service "$pkgdir/usr/lib/systemd/user/notekpr-sync@.service"

# semrel made the release with its notes; this only adds the files. Run
# again after a failure, it replaces those already there, so they match what
# the AUR package is made from.
release:
  github:
    owner: coolapso
    name: notekpr
  mode: keep-existing
  replace_existing_artifacts: true

changelog:
  disable: true
