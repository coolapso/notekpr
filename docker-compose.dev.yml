# Local development: no OIDC needed. Sign in as any user name (alice, bob, …).
# Open several browser tabs (each tab keeps its own session) to test sharing
# and live collaboration between users.
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:8080
#
# Optional: also start a local OIDC provider (Dex) to try the real login flow:
#   docker compose -f docker-compose.dev.yml --profile oidc up --build
#   then open http://localhost:8081 and sign in as olivia@example.com / password
#
# Never run this on a production host: it is a separate compose project
# ("notekpr-dev"), so it can't replace the production containers, but
# anyone who can reach a dev-mode server can sign in as anyone.
name: notekpr-dev
services:
  notekpr:
    build: .
    image: notekpr:latest
    environment:
      NOTEKPR_DEV_MODE: "true"
      # Inside the container the server listens on 0.0.0.0; the port is only
      # published on 127.0.0.1 below, so dev mode is reachable just from here.
      NOTEKPR_DEV_MODE_ANYWHERE: "true"
      NOTEKPR_PUBLIC_URL: http://localhost:8080
      NOTEKPR_LOG_FORMAT: pretty
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dev-data:/data

  dex:
    profiles: ["oidc"]
    image: ghcr.io/dexidp/dex:v2.43.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    network_mode: host
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro

  notekpr-oidc:
    profiles: ["oidc"]
    image: notekpr:latest
    network_mode: host
    environment:
      NOTEKPR_LISTEN: 127.0.0.1:8081
      NOTEKPR_PUBLIC_URL: http://localhost:8081
      NOTEKPR_OIDC_ISSUER: http://127.0.0.1:5556/dex
      NOTEKPR_OIDC_CLIENT_ID: notekpr
      NOTEKPR_OIDC_CLIENT_SECRET: devsecret
      NOTEKPR_OIDC_DISPLAY_NAME: Dex (local)
      NOTEKPR_LOG_FORMAT: pretty
    volumes:
      - dev-oidc-data:/data
    depends_on:
      - dex

volumes:
  dev-data:
  dev-oidc-data:
