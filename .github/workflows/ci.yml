name: ci
on:
  push:
  pull_request:

# CI is a fresh developer machine: it installs the tooling, then runs the
# same task a developer runs (`task ci`, see Taskfile.yml). Nothing is done
# here that can't be done locally. The two jobs are task ci's two halves, on
# separate machines: one runner's disk doesn't hold both builds.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, with the wasm32 target, clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The wasm-bindgen CLI the crates pin, and cargo-deny
        run: |
          v=$(sed -nE 's/^wasm-bindgen = "=([0-9.]+)".*/\1/p' crates/web/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$v" --locked
          cargo install cargo-deny --locked
      - name: Chromium and chromedriver
        run: |
          sudo apt-get update && sudo apt-get install -y chromium-driver || true
          # The runner image ships Chrome and a matching chromedriver too.
          [ -n "${CHROMEWEBDRIVER:-}" ] && echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          echo "CPN_CHROME=$(command -v chromium || command -v chromium-browser || command -v google-chrome)" >> "$GITHUB_ENV"
      - name: The toolchain
        run: task setup
      - name: task ci:check
        run: task ci:check

  # The images build everything inside Docker: no Rust needed here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: task ci:image
        run: task ci:image
