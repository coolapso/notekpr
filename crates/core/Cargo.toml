[package]
name = "notekpr-core"
description = "Shared cryptography, protocol types and document model for notekpr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
hkdf = "0.13"
sha2 = "0.11"
blake3 = { version = "1.8", default-features = false }
getrandom = "0.4"
data-encoding = "2.11"
zeroize = { version = "1.9", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
yrs = { version = "0.28", features = ["sync"] }
similar = { version = "3", default-features = false }
unicode-normalization = "0.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
