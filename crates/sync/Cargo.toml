[package]
name = "notekpr-sync"
description = "The client sync engine shared by the notekpr browser and desktop clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notekpr-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
