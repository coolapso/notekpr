[package]
name = "notekpr-client"
description = "notekpr desktop sync client and agent gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "notekpr_client"
path = "src/lib.rs"

[[bin]]
name = "notekpr"
path = "src/main.rs"

[dependencies]
notekpr-core = { path = "../core" }
notekpr-sync = { path = "../sync" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "net", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio-stream = { version = "0.1", features = ["sync"] }
notify = { version = "8", default-features = false }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.8"
data-encoding = "2.11"
zeroize = "1.9"
subtle = "2.6"
mime_guess = "2"
url = "2"
time = { version = "0.3", features = ["formatting"] }
rpassword = "7"
libc = "0.2"
# NoteDoc holds an optional yrs UndoManager; the "sync" feature makes its
# callbacks Send + Sync so replicas can be shared across tokio tasks.
yrs = { version = "0.28", features = ["sync"] }
similar = { version = "3", default-features = false }

[dev-dependencies]
notekpr-server = { path = "../server" }
# Tests play a compromised server by changing its database directly.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
