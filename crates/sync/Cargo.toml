[package]
name = "coolpsonotes-sync"
description = "The client sync engine shared by the coolpsonotes browser and desktop clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
coolpsonotes-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
