# Fuzz targets (libFuzzer). Not a workspace member: built only by `task fuzz`
# (or `cargo fuzz` on nightly). See docs/development.md.
[package]
name = "coolpsonotes-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
coolpsonotes-core = { path = "../crates/core" }
coolpsonotes-web = { path = "../crates/web" }
serde_json = "1"

[workspace]

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false

[[bin]]
name = "textdiff"
path = "fuzz_targets/textdiff.rs"
test = false
doc = false

[[bin]]
name = "envelopes"
path = "fuzz_targets/envelopes.rs"
test = false
doc = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false

[[bin]]
name = "crdt"
path = "fuzz_targets/crdt.rs"
test = false
doc = false
