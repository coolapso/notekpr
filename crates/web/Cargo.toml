[package]
name = "notekpr-web"
description = "notekpr browser client (Rust, compiled to WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
notekpr-core = { path = "../core" }
notekpr-editor = { path = "../editor" }
notekpr-sync = { path = "../sync" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
console_error_panic_hook = "0.1"
data-encoding = "2.11"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
crc32fast = { version = "1.5", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "Text", "Range", "Selection",
  "Location", "History", "Storage", "Headers", "Request", "RequestInit", "RequestMode", "Response",
  "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Event", "EventTarget", "KeyboardEvent",
  "MouseEvent", "InputEvent", "FocusEvent", "ClipboardEvent", "DataTransfer", "DragEvent",
  "HtmlInputElement", "HtmlTextAreaElement", "HtmlAnchorElement", "HtmlImageElement", "HtmlDivElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "PointerEvent", "WheelEvent", "AddEventListenerOptions",
  "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader", "DomRect", "DomRectList",
  "CssStyleDeclaration", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
  "MediaQueryList", "Navigator", "Clipboard", "DomTokenList", "StaticRange", "TreeWalker", "NodeFilter",
  "CompositionEvent", "ResizeObserver", "VisibilityState", "PopStateEvent", "AbortController", "AbortSignal",
  "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbRequest", "IdbOpenDbRequest", "IdbTransaction",
  "IdbTransactionMode", "IdbKeyRange", "DomStringList", "DomException",
  "ServiceWorkerContainer", "ServiceWorkerRegistration", "CacheStorage",
  "Notification", "NotificationOptions", "NotificationPermission",
]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
