{{ with .Params.cards }}<section class="feature-grid">
    {{ range . }}<a class="feature-card" href="{{ strings.TrimPrefix "/" .url | relURL }}">{{ with .icon }}<i class="feature-icon" aria-hidden="true">{{ . }}</i>{{ end }}<span>{{ .title }}</span><p>{{ .description }}</p></a>{{ end }}
  </section>{{ end }}
