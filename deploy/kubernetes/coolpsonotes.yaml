# coolpsonotes on Kubernetes.
# Single replica by design: the server uses SQLite and an in-process event hub.
# Apply with:  kubectl apply -f deploy/kubernetes/coolpsonotes.yaml
# (edit the ConfigMap, Secret and Ingress host first)
apiVersion: v1
kind: Namespace
metadata:
  name: coolpsonotes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coolpsonotes
  namespace: coolpsonotes
data:
  COOLPSONOTES_PUBLIC_URL: "https://notes.example.com"
  COOLPSONOTES_OIDC_ISSUER: "https://auth.example.com"
  COOLPSONOTES_OIDC_CLIENT_ID: "coolpsonotes"
  COOLPSONOTES_TRUST_PROXY: "true"
  COOLPSONOTES_LOG_FORMAT: "json"
---
apiVersion: v1
kind: Secret
metadata:
  name: coolpsonotes
  namespace: coolpsonotes
type: Opaque
stringData:
  COOLPSONOTES_OIDC_CLIENT_SECRET: "change-me"
  # Optional bearer token protecting /metrics (recommended: the Ingress below
  # routes every path, /metrics included).
  # COOLPSONOTES_METRICS_TOKEN: change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coolpsonotes-data
  namespace: coolpsonotes
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolpsonotes
  namespace: coolpsonotes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coolpsonotes
  template:
    metadata:
      labels:
        app: coolpsonotes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coolpsonotes
          image: ghcr.io/coolapso/coolpsonotes:latest
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: coolpsonotes
            - secretRef:
                name: coolpsonotes
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coolpsonotes-data
---
apiVersion: v1
kind: Service
metadata:
  name: coolpsonotes
  namespace: coolpsonotes
spec:
  selector:
    app: coolpsonotes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coolpsonotes
  namespace: coolpsonotes
  annotations:
    # WebSockets stay open for a long time; raise proxy timeouts (ingress-nginx).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  tls:
    - hosts: ["notes.example.com"]
      secretName: coolpsonotes-tls
  rules:
    - host: notes.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coolpsonotes
                port:
                  name: http
