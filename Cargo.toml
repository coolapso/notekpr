[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/server", "crates/client", "crates/editor", "crates/web", "crates/load-events", "crates/load", "crates/load-ui"]
# The web crate (and the load test's dashboard) only make sense for wasm32;
# build them with scripts/build-web.sh and scripts/build-load-ui.sh.
default-members = ["crates/core", "crates/sync", "crates/server", "crates/client", "crates/editor", "crates/load-events", "crates/load"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/coolapso/coolpsonotes"
rust-version = "1.94"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Small, fast WebAssembly for the browser client.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# yrs's debug_assert on 53-bit client ids fires on crafted updates (found by
# fuzzing); release builds compile it out, so dev builds do too.
[profile.dev.package.yrs]
debug-assertions = false

# yrs with fixes for panics on crafted updates (see vendor/yrs/COOLPSONOTES.md).
[patch.crates-io]
yrs = { path = "vendor/yrs" }
