# Fuzz targets (libFuzzer). Not a workspace member: built only by `task fuzz`
# (or `cargo fuzz` on nightly). See docs/development.md.
[package]
name = "notekpr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
notekpr-core = { path = "../crates/core" }
notekpr-web = { path = "../crates/web" }
notekpr-editor = { path = "../crates/editor" }
serde_json = "1"
html5ever = "0.40"

[workspace]

# Our code with debug assertions and overflow checks; yrs as in release
# builds (its debug_assert on 53-bit client ids fires on crafted input but is
# compiled out where it runs for real).
[profile.release]
debug-assertions = true
overflow-checks = true

[profile.release.package.yrs]
debug-assertions = false
overflow-checks = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false

[[bin]]
name = "textdiff"
path = "fuzz_targets/textdiff.rs"
test = false
doc = false

[[bin]]
name = "envelopes"
path = "fuzz_targets/envelopes.rs"
test = false
doc = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false

[[bin]]
name = "crdt"
path = "fuzz_targets/crdt.rs"
test = false
doc = false

# yrs with fixes for panics on crafted updates (see vendor/yrs/NOTEKPR.md).
[patch.crates-io]
yrs = { path = "../vendor/yrs" }

[[bin]]
name = "editor"
path = "fuzz_targets/editor.rs"
test = false
doc = false

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
