name: fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Like ci.yml: install the tooling, then run the task (`task fuzz`).
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fuzz every target for 5 minutes
        run: task fuzz SECS=300
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
