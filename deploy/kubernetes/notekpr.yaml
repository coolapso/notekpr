# notekpr on Kubernetes.
# Single replica by design: the server uses SQLite and an in-process event hub.
# Apply with:  kubectl apply -f deploy/kubernetes/notekpr.yaml
# (edit the ConfigMap and Secret first). It serves plain HTTP inside the
# cluster: put the ingress you use in front of the Service, with TLS — e.g.
# deploy/examples/traefik/ingressroute.yaml (docs/operations.md §4).
apiVersion: v1
kind: Namespace
metadata:
  name: notekpr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notekpr
  namespace: notekpr
data:
  NOTEKPR_PUBLIC_URL: "https://notes.example.com"
  NOTEKPR_OIDC_ISSUER: "https://auth.example.com"
  NOTEKPR_OIDC_CLIENT_ID: "notekpr"
  NOTEKPR_TRUST_PROXY: "true"
  NOTEKPR_LOG_FORMAT: "json"
  # Attachments are files in /data/files by default; to keep them in S3 or
  # anything compatible instead (docs/operations.md, "Where attachments are
  # kept"), with the AWS_* credentials in the Secret below:
  # NOTEKPR_FILE_STORE: "s3://notekpr/notes"
  # AWS_REGION: "eu-central-1"
  # AWS_ENDPOINT: "https://s3.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: notekpr
  namespace: notekpr
type: Opaque
stringData:
  NOTEKPR_OIDC_CLIENT_SECRET: "change-me"
  # Optional bearer token protecting /metrics (recommended if your ingress
  # routes every path, /metrics included).
  # NOTEKPR_METRICS_TOKEN: change-me
  # For an S3 file store (NOTEKPR_FILE_STORE above):
  # AWS_ACCESS_KEY_ID: change-me
  # AWS_SECRET_ACCESS_KEY: change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notekpr-data
  namespace: notekpr
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notekpr
  namespace: notekpr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notekpr
  template:
    metadata:
      labels:
        app: notekpr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notekpr
          # Published for amd64 and arm64 with every release, tagged with its
          # version and latest. Pin a version (:0.6.0) here and in
          # backup-cronjob.yaml to choose when you upgrade (operations.md §7).
          image: ghcr.io/coolapso/notekpr:latest
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: notekpr
            - secretRef:
                name: notekpr
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notekpr-data
---
apiVersion: v1
kind: Service
metadata:
  name: notekpr
  namespace: notekpr
spec:
  selector:
    app: notekpr
  ports:
    - name: http
      port: 80
      targetPort: http
