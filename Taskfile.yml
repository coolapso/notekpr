# Common development tasks. Requires go-task v3 (https://taskfile.dev).
#   task            list tasks
#   task dev        run a development server (no OIDC, sign in as any user name)
#   task test       run all Rust tests
version: "3"

vars:
  CI_INFISICAL_PROJECT_ID: "7897aa98-f8e5-40f2-a83d-f4926cdba05b"
  CLI_INFISICAL_PROJECT_ID: "4f12d18e-e075-4a6c-ba6c-367bec3e62e7"
  LISTEN: 127.0.0.1:8080
  PUBLIC_URL: http://localhost:8080
  DATA_DIR: data
  # `task dev`'s admin client "dev" (every scope): a fixed token, fine for a
  # development server on this machine only; another one with
  # `task dev DEV_ADMIN_TOKEN=notekpr_a_…`.
  DEV_ADMIN_TOKEN: notekpr_a_dev-admin-token-for-this-machine-only
  # `task docs:serve`: the docs site's preview; `task docs:deploy`: its
  # Cloudflare Pages project.
  DOCS_PORT: "8091"
  DOCS_PROJECT: notekpr-docs
  # `task demo`: its own server, database and CLI profiles, next to `task dev`.
  DEMO_LISTEN: 127.0.0.1:8099
  DEMO_DIR: data/demo
  BACKUP_DIR: backups
  # The web client is built in its own target directory so native and wasm
  # builds don't keep invalidating each other's dependencies.
  WEB_TARGET_DIR: target-web
  WASM_BINDGEN_VERSION:
    sh: sed -nE 's/^wasm-bindgen = "=([0-9.]+)".*/\1/p' crates/web/Cargo.toml
  RUST_VERSION:
    sh: sed -nE 's/^rust-version = "([0-9.]+)".*/\1/p' Cargo.toml
  # The release tool (`task release`); its plugins are pinned in .semrel.lock.
  # At least v0.27.0: older ones ignore .semrel.yaml's rules for build and
  # refactor commits (they release only for feat, fix, perf and revert).
  SEMREL_VERSION: v0.28.2
  # Fedora's COPR project the CLI and the desktop app are built in (`task release:copr`), and the
  # copr-cli `task tools:copr` installs.
  COPR_PROJECT: coolapso/notekpr
  COPR_CLI_VERSION: "2.6"
  # What an installed package of the CLI must do and hold (test:packages,
  # test:srpm).
  PACKAGE_CHECK: >-
    notekpr --version && notekpr completions zsh > /dev/null
    && test -f /usr/share/bash-completion/completions/notekpr
    && test -f /usr/lib/systemd/user/notekpr-sync@.service
  # And of the desktop app: every library it links found, the tray's (which
  # it loads when it shows a tray) there, its desktop entry and icon.
  DESKTOP_PACKAGE_CHECK: >-
    notekpr-desktop --version
    && ! ldd /usr/bin/notekpr-desktop | grep "not found"
    && ldconfig -p | grep -q libayatana-appindicator3.so.1
    && test -f /usr/share/applications/md.notekpr.Notekpr.desktop
    && test -f /usr/share/icons/hicolor/scalable/apps/md.notekpr.Notekpr.svg
  # The desktop app's Flatpak is built with GNOME's runtime (packaging/flatpak's
  # runtime-version) and the Rust extension of the freedesktop SDK under it.
  FLATPAK_GNOME: "51"
  FLATPAK_FREEDESKTOP: "26.08"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ------------------------------------------------------------------ setup

  setup:
    desc: Check the toolchain (Rust, wasm32 target, wasm-bindgen CLI, test tools) and say how to get what's missing
    silent: true
    cmds:
      - cmd: |
          ok=1
          if ! v=$(rustc --version 2>/dev/null | awk '{print $2}') || [ -z "$v" ]; then
            echo "✗ no working Rust compiler (Arch: sudo pacman -S rust)"; ok=0
          else
            if [ "$(printf '%s\n' "{{.RUST_VERSION}}" "$v" | sort -V | head -1)" = "{{.RUST_VERSION}}" ]; then
              echo "✓ rustc $v"
            else
              echo "✗ rustc $v is older than {{.RUST_VERSION}}"; ok=0
            fi
            if [ -d "$(rustc --print sysroot)/lib/rustlib/wasm32-unknown-unknown" ]; then
              echo "✓ wasm32-unknown-unknown target"
            else
              echo "✗ wasm32-unknown-unknown target missing (Arch: sudo pacman -S rust-wasm; rustup: rustup target add wasm32-unknown-unknown)"; ok=0
            fi
          fi
          have=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')
          if [ "$have" = "{{.WASM_BINDGEN_VERSION}}" ]; then
            echo "✓ wasm-bindgen $have"
          else
            echo "✗ wasm-bindgen CLI {{.WASM_BINDGEN_VERSION}} needed, found ${have:-none}"
            echo "    Arch: sudo pacman -S wasm-bindgen (if it is {{.WASM_BINDGEN_VERSION}}), otherwise:"
            echo "    cargo install wasm-bindgen-cli --version {{.WASM_BINDGEN_VERSION}} --locked   (~/.cargo/bin must come first in PATH)"
            ok=0
          fi
          command -v wasm-opt >/dev/null && echo "✓ wasm-opt (smaller release builds)" || echo "· optional: wasm-opt for smaller release builds (Arch: binaryen)"
          if command -v chromedriver >/dev/null && command -v python3 >/dev/null; then
            echo "✓ chromedriver + python3 (browser tests)"
          else
            echo "· for the browser tests (task test:e2e, task test:editor, task ci): chromium with chromedriver, and python3 (Arch: chromium python)"
          fi
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 2>/dev/null; then
            echo "✓ WebKitGTK 4.1 and GTK 3 (the desktop app)"
          else
            echo "✗ the desktop app (crates/desktop, built by task test and task lint) needs WebKitGTK 4.1 and GTK 3 with their headers (Arch: webkit2gtk-4.1; Debian, Ubuntu: libwebkit2gtk-4.1-dev)"; ok=0
          fi
          if command -v dbus-daemon >/dev/null; then
            echo "✓ dbus-daemon (the desktop app's tests)"
          else
            echo "✗ the desktop app's tests (task test) need dbus-daemon, for a private message bus (Arch, Debian, Ubuntu: dbus)"; ok=0
          fi
          pkg-config --exists ayatana-appindicator3-0.1 2>/dev/null && echo "✓ libayatana-appindicator (the desktop app's tray)" || echo "· for the desktop app's tray icon when it runs: libayatana-appindicator (Arch: libayatana-appindicator; Debian, Ubuntu: libayatana-appindicator3-1)"
          if command -v sway >/dev/null && command -v WebKitWebDriver >/dev/null && command -v dbus-run-session >/dev/null; then
            echo "✓ sway + WebKitWebDriver (the desktop app's browser test)"
          else
            echo "· for the desktop app's browser test (task test:e2e, skipped without): sway, WebKitWebDriver and dbus-run-session (Arch: sway webkit2gtk-4.1 dbus; Debian, Ubuntu: sway webkit2gtk-driver dbus)"
          fi
          command -v cargo-deny >/dev/null && echo "✓ cargo-deny (task audit)" || echo "· for task audit and task ci: cargo-deny (Arch: cargo-deny; or cargo install cargo-deny --locked)"
          command -v docker >/dev/null && echo "✓ docker (container image, Docker dev stack)" || echo "· for the docker:* tasks, task load and task ci: docker + compose (Arch: docker docker-compose docker-buildx)"
          command -v semrel >/dev/null && command -v jq >/dev/null && echo "✓ semrel + jq (task release)" || echo "· for task release: semrel (task tools:release, needs Go) and jq (Arch: jq)"
          command -v copr-cli >/dev/null && echo "✓ copr-cli (task release, Fedora's COPR)" || echo "· for task release: copr-cli (Arch: copr-cli; or task tools:copr, needs pipx)"
          command -v hugo >/dev/null && echo "✓ hugo (task docs:serve)" || echo "· for the docs site (task docs:serve, task docs:check, task ci): hugo 0.168 or newer (Arch: hugo)"
          command -v wrangler >/dev/null && echo "✓ wrangler (task docs:deploy)" || echo "· to publish the docs site (task docs:deploy): wrangler, signed in with wrangler login (Arch: wrangler)"
          [ "$ok" = 1 ]

  rust:
    internal: true
    run: once
    preconditions:
      - sh: cargo --version > /dev/null 2>&1
        msg: "cargo doesn't work. Run `task setup` to see what's missing (with rustup but no toolchain: reinstall your distribution's Rust, on Arch `sudo pacman -S rust`, or run `rustup default stable`)."

  # ------------------------------------------------------------------ docs site

  docs:serve:
    desc: "Preview the docs site (docs.notekpr.md: docs/*.md with Hugo, docs/site) on http://localhost:{{.DOCS_PORT}}, updated as the docs change (another port: DOCS_PORT=…)"
    cmds:
      - hugo server --source docs/site --bind 127.0.0.1 --port {{.DOCS_PORT}} --baseURL http://localhost:{{.DOCS_PORT}}/

  docs:build:
    desc: Build the docs site into dist/docs, as it is published
    cmds:
      - hugo --source docs/site --destination "{{.ROOT_DIR}}/dist/docs" --cleanDestinationDir --minify

  docs:check:
    desc: "Build the docs site and check it: every doc is on it, every link and #anchor goes somewhere"
    cmds:
      - python3 scripts/check-docs.py

  docs:shots:
    desc: "Take the user guide's screenshots again (docs/assets/guide) from a demo of their own (chromium + chromedriver); one or some: task docs:shots -- --only gs-app,wr-math"
    deps: [build:server, build:cli]
    cmds:
      - CARGO_TARGET_DIR="{{.WEB_TARGET_DIR}}" PROFILE=dev OUT=target/guide-web ./scripts/build-web.sh > /dev/null
      - python3 -u scripts/guide-shots.py --web target/guide-web {{.CLI_ARGS}}

  docs:theme:
    desc: "Copy the Dockleaf theme into docs/site/themes/dockleaf from a checkout: task docs:theme DOCKLEAF=~/Dev/dockleaf (REF=a tag or commit; default the checkout's)"
    requires:
      vars: [DOCKLEAF]
    cmds:
      - scripts/docs-theme.sh "{{.DOCKLEAF}}" "{{.REF | default "HEAD"}}"

  docs:deploy:
    desc: "Check the docs site, build it and publish it on Cloudflare Pages (project {{.DOCS_PROJECT}}, docs.notekpr.md) with wrangler: from main the site itself, from another branch a preview (task release does, last; run it again if it failed there)"
    preconditions:
      - sh: command -v wrangler >/dev/null
        msg: "The docs site is published with wrangler (Arch: wrangler), signed in once with `wrangler login` (or CLOUDFLARE_API_TOKEN in the environment)."
    # wrangler keeps its cache in .wrangler/ where it runs
    dir: docs/site
    cmds:
      - task: docs:check
      - task: docs:build
      - wrangler pages deploy "{{.ROOT_DIR}}/dist/docs" --project-name={{.DOCS_PROJECT}}

  # ------------------------------------------------------------------ build

  build:
    desc: Build the server, the CLI and the web client (debug)
    deps: [build:server, build:cli, build:web:dev]

  build:server:
    desc: Build the server (debug)
    deps: [rust]
    cmds:
      - cargo build -p notekpr-server

  build:cli:
    desc: Build the CLI `notekpr` (debug)
    deps: [rust]
    cmds:
      - cargo build -p notekpr-cli

  build:web:
    desc: Build the optimized web client into dist/web
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
    cmds:
      - ./scripts/build-web.sh

  build:desktop:
    desc: "Build the desktop app (target/release/notekpr-desktop) with the optimized web client inside"
    deps: [rust]
    cmds:
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} OUT=dist/desktop-web ./scripts/build-web.sh
      - 'TAURI_CONFIG=''{"build":{"frontendDist":"../../dist/desktop-web"}}'' cargo build --release --locked -p notekpr-desktop'

  build:web:dev:
    desc: Build the web client quickly (unoptimized) into dist/web
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
      PROFILE: dev
    cmds:
      - ./scripts/build-web.sh > /dev/null
      - echo "web client (dev) built into dist/web"
    silent: true

  build:release:
    desc: Release build of the server and CLI (target/release) plus the optimized web client
    deps: [rust]
    cmds:
      - cargo build --release --locked -p notekpr-server -p notekpr-cli
      - task: build:web

  # ------------------------------------------------------------------ run

  dev:
    desc: "Run the server in development mode on {{.PUBLIC_URL}}: no OIDC, sign in as any user (one per browser tab)"
    deps: [build:server, build:web:dev]
    vars:
      ADMINLESS: '{{.ADMINLESS | default "false"}}'
    cmds:
      - cmd: echo "{{.DEV_ADMIN_TOKEN}}" | ./target/debug/notekpr-server --data-dir {{.DATA_DIR}} admin-client ensure --name dev --scopes all --tokens-file -
        silent: true
      - cmd: 'echo "admin client: curl -H \"Authorization: Bearer {{.DEV_ADMIN_TOKEN}}\" {{.PUBLIC_URL}}/api/v1/admin/settings"'
        silent: true
      - ./target/debug/notekpr-server --dev-mode --adminless {{.ADMINLESS}} --web-dir dist/web --data-dir {{.DATA_DIR}} --listen {{.LISTEN}} --public-url {{.PUBLIC_URL}} --log-format pretty {{.CLI_ARGS}}

  desktop:
    desc: "Run the desktop app with the web client inside (unoptimized), e.g. against `task dev`: choose http://localhost:8080 in it. A second person side by side: task desktop -- --profile bob. Its settings and data are in data/desktop, apart from an installed app's"
    deps: [rust]
    cmds:
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} PROFILE=dev OUT=dist/desktop-web ./scripts/build-web.sh > /dev/null
      # Folders of its own: an installed app's settings, sign-ins, Markdown
      # folder and autostart entry stay untouched, and it runs beside it.
      - 'TAURI_CONFIG=''{"build":{"frontendDist":"../../dist/desktop-web"}}'' cargo run -q -p notekpr-desktop -- --config-dir "{{.ROOT_DIR}}/data/desktop/config" --data-dir "{{.ROOT_DIR}}/data/desktop/data" {{.CLI_ARGS}}'

  dev:adminless:
    desc: "`task dev` as an admin-less instance: nobody signing in administers anything, only admin clients (the dev one: its curl line) do. Same data as `task dev`"
    cmds:
      - task: dev
        vars: { ADMINLESS: "true" }

  web:watch:
    desc: Rebuild the web client whenever its code changes (run next to `task dev`, then reload the browser)
    watch: true
    method: none
    sources:
      - crates/web/**/*
      - crates/editor/**/*.rs
      - crates/core/**/*.rs
    cmds:
      - task: build:web:dev

  web:card:
    desc: "Render the social card (scripts/social-card.html: the picture a link to a server shows) to crates/web/static/social.png, 1200×630, with headless Chromium"
    preconditions:
      - sh: command -v chromium >/dev/null && command -v optipng >/dev/null
        msg: "Needs chromium and optipng."
    cmds:
      - chromium --headless=new --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 --window-size=1200,630 --screenshot="{{.ROOT_DIR}}/crates/web/static/social.png" "file://{{.ROOT_DIR}}/scripts/social-card.html"
      - optipng -quiet -o2 "{{.ROOT_DIR}}/crates/web/static/social.png"

  dev:reset:
    desc: Delete the development database (all local test users, vaults and notes)
    prompt: "This deletes everything in {{.DATA_DIR}}/. Continue?"
    cmds:
      - rm -rf {{.DATA_DIR}}

  demo:
    desc: "Run a demo on http://localhost:8099 (another port: DEMO_LISTEN=127.0.0.1:PORT) — users, shared vaults and notes, a linked vault for the graph (created on the first run)"
    deps: [build:server, build:cli, build:web:dev]
    cmds:
      - python3 -u scripts/demo.py --listen {{.DEMO_LISTEN}} --data {{.DEMO_DIR}} {{.CLI_ARGS}}

  demo:reset:
    desc: Delete the demo's data (the next `task demo` creates it again)
    prompt: "This deletes everything in {{.DEMO_DIR}}/. Continue?"
    cmds:
      - rm -rf {{.DEMO_DIR}}

  demo:cli:
    desc: "Run the CLI as a demo user, e.g. `task demo:cli -- --profile bob vault list`"
    deps: [rust]
    env:
      NOTEKPR_CONFIG_DIR: "{{.ROOT_DIR}}/{{.DEMO_DIR}}/cli/config"
      NOTEKPR_DATA_DIR: "{{.ROOT_DIR}}/{{.DEMO_DIR}}/cli/data"
    cmds:
      - cargo run -q -p notekpr-cli -- {{.CLI_ARGS}}

  cli:
    desc: "Run the CLI, e.g. `task cli -- --profile alice status`"
    deps: [rust]
    cmds:
      - cargo run -q -p notekpr-cli -- {{.CLI_ARGS}}

  cli:login:
    desc: "Sign the CLI in to the dev server as a test user, e.g. `task cli:login DEV_USER=alice` (profile = user name)"
    deps: [rust]
    requires:
      vars: [DEV_USER]
    cmds:
      - cargo run -q -p notekpr-cli -- --profile {{.DEV_USER}} login --server {{.PUBLIC_URL}} --dev-user {{.DEV_USER}}

  backup:
    desc: "Write a timestamped backup of {{.DATA_DIR}} into {{.BACKUP_DIR}}/ (safe while the server runs; keeps the newest 10)"
    deps: [build:server]
    cmds:
      - ./target/debug/notekpr-server backup --data-dir {{.DATA_DIR}} --out-dir {{.BACKUP_DIR}} --keep 10

  # ------------------------------------------------------------------ test & lint

  test:
    desc: Run all Rust tests (every crate in the workspace)
    deps: [rust]
    cmds:
      - cargo test --locked --workspace
      # The diagram module, a workspace of its own (crates/diagram/Cargo.toml says why).
      - cargo test --locked --manifest-path crates/diagram/Cargo.toml --target-dir target

  test:core:
    desc: Crypto, key hierarchy, CRDT model, protocol
    deps: [rust]
    cmds:
      - cargo test -p notekpr-core

  test:server:
    desc: Server API tests with real client-side crypto
    deps: [rust]
    cmds:
      - cargo test -p notekpr-server

  test:cli:
    desc: Sync engine, Markdown mirror and gateway against an in-process server
    deps: [rust]
    cmds:
      - cargo test -p notekpr-cli

  test:web:
    desc: Safe rendering, zip (natively)
    deps: [rust]
    cmds:
      - cargo test -p notekpr-web

  test:s3:
    desc: "Attachments in S3-compatible storage, against a local Garage in Docker (started and removed by scripts/test-s3.sh)"
    deps: [rust]
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is needed (it runs Garage, an S3-compatible server)"
    cmds:
      - scripts/test-s3.sh {{.CLI_ARGS}}

  fuzz:
    desc: "Fuzz the parsers (stable toolchain, libFuzzer): `task fuzz` (every target, SECS=60 each) or `task fuzz -- zip 300`"
    deps: [rust]
    vars:
      SECS: '{{.SECS | default "60"}}'
    cmds:
      - fuzz/run.sh {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}"" {{.SECS}}{{end}}

  test:editor:
    desc: "The editor: its model natively, then its DOM view in headless Chromium (wasm-bindgen-test; needs chromedriver); `task test:editor -- --nocapture` shows timings"
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    preconditions:
      - sh: '[ "$(wasm-bindgen-test-runner --version 2>/dev/null | awk ''{print $2}'')" = "{{.WASM_BINDGEN_VERSION}}" ]'
        msg: "wasm-bindgen-test-runner {{.WASM_BINDGEN_VERSION}} is needed (it comes with the wasm-bindgen CLI: cargo install wasm-bindgen-cli --version {{.WASM_BINDGEN_VERSION}} --locked)"
      - sh: command -v chromedriver
        msg: "chromedriver is needed (Arch: chromium)"
    cmds:
      - cargo test -p notekpr-editor
      - CHROMEDRIVER="${CHROMEDRIVER:-$(command -v chromedriver)}" cargo test -p notekpr-editor --target wasm32-unknown-unknown --test browser {{.CLI_ARGS}}

  test:e2e:
    desc: "Headless browser tests and browser ↔ CLI test (needs chromium + chromedriver); only some with `task test:e2e -- -k collab` (the browser ↔ CLI tests are cross_client and drawings)"
    deps: [rust]
    cmds:
      - tests/e2e/run.sh {{.CLI_ARGS}}

  fmt:
    desc: Format all Rust code (rustfmt defaults)
    deps: [rust]
    cmds:
      - cargo fmt --all
      - cargo fmt --manifest-path crates/diagram/Cargo.toml

  fmt:check:
    desc: Fail if any Rust code is not formatted
    deps: [rust]
    cmds:
      - cargo fmt --all -- --check
      - cargo fmt --manifest-path crates/diagram/Cargo.toml -- --check

  lint:
    desc: Clippy on every crate (warnings are errors), including the web client for wasm32
    deps: [rust]
    cmds:
      - cargo clippy --locked -p notekpr-core -p notekpr-draw -p notekpr-server -p notekpr-sync -p notekpr-cli -p notekpr-editor -p notekpr-mhchem -p notekpr-notion -p notekpr-load-events -p notekpr-load -p notekpr-load-ui -p notekpr-desktop --all-targets -- -D warnings
      # The web client's tests run natively.
      - cargo clippy --locked -p notekpr-web --tests -- -D warnings -A clippy::type_complexity
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo clippy --locked -p notekpr-web --target wasm32-unknown-unknown -- -D warnings -A clippy::type_complexity
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo clippy --locked -p notekpr-editor --target wasm32-unknown-unknown --all-targets -- -D warnings
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo clippy --locked -p notekpr-load-ui --target wasm32-unknown-unknown -- -D warnings
      # The diagram module the web client loads: a workspace of its own (its
      # browser half is wasm32 only).
      - cargo clippy --locked --manifest-path crates/diagram/Cargo.toml --target-dir target --all-targets -- -D warnings
      - cargo clippy --locked --manifest-path crates/diagram/Cargo.toml --target-dir {{.WEB_TARGET_DIR}} --target wasm32-unknown-unknown -- -D warnings

  check:wasm:
    desc: Make sure the core crate still builds for the browser
    deps: [rust]
    cmds:
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo build --locked -p notekpr-core --target wasm32-unknown-unknown

  audit:
    desc: Supply-chain checks (licenses, advisories, sources) with cargo-deny
    preconditions:
      - sh: command -v cargo-deny
        msg: "cargo-deny is not installed: cargo install cargo-deny --locked"
    cmds:
      - cargo deny check
      - cargo deny --manifest-path crates/diagram/Cargo.toml --config deny.toml check

  ci:
    desc: "Exactly what CI runs (it installs the tooling, then this): ci:check, ci:image and ci:clients"
    cmds:
      - task: ci:check
      - task: ci:image
      - task: ci:clients

  # CI runs these as separate jobs, ci:image and ci:clients once ci:check
  # passes: one machine's disk (14 GB guaranteed on GitHub's runners) doesn't
  # hold the test builds and the image or release builds.
  ci:check:
    desc: "Format check, lint, every test, the wasm build, the editor's and the browser tests, the supply-chain check, the docs site's links"
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: test:s3
      - task: check:wasm
      - task: test:editor
      - task: test:e2e
      - task: audit
      - task: docs:check

  ci:image:
    desc: "The container images: the server's and the public demo's"
    cmds:
      - task: docker:build
      # Shares the build stage: only checks the demo's own layer still builds.
      - task: docker:build:demo
      - task: docker:test:demo

  ci:clients:
    desc: "The CLI's and the desktop app's release files and packages, without publishing (build:clients), their .deb and .rpm installed and run (test:packages), and their source RPMs built in Fedora the way COPR does (test:srpm)"
    cmds:
      - task: build:clients
      - task: test:packages
      - task: test:srpm

  # ------------------------------------------------------------------ CLI and desktop app packages
  # GoReleaser (.goreleaser.yaml) in the clients' build image (packaging/Dockerfile,
  # run by packaging/run.sh): Docker is all these need.

  build:clients:
    desc: "Build the CLI's and the desktop app's release files into dist/clients without publishing: Linux (amd64, arm64) as .tar.gz, .deb and .rpm, AUR's PKGBUILDs and COPR's source RPMs, and Windows (x64) installers (in Docker)"
    cmds:
      - packaging/run.sh goreleaser release --snapshot --clean
      - packaging/run.sh packaging/rpm/srpm.sh dist/clients

  # macOS builds need Apple's own tools, which run on Macs only (and Apple's
  # licence allows them there only): no Docker image. GitHub's macOS runner
  # runs these for releases (release:macos:dispatch).
  build:macos:
    desc: "On a Mac (Apple Silicon): build the CLI's and the desktop app's macOS release files into dist/clients, the app's .dmg and the CLI's .tar.gz (packaging/macos), as VERSION (default: named as GoReleaser names a snapshot)"
    deps: [rust]
    vars:
      SNAPSHOT:
        sh: git describe --tags --always --dirty --match 'v[0-9]*' | sed 's/^v//'
      VERSION: '{{.VERSION | default .SNAPSHOT}}'
    preconditions:
      - sh: test "$(uname -s)" = Darwin
        msg: "build:macos runs on a Mac: macOS builds need Apple's own tools"
    env:
      NOTEKPR_VERSION: "{{.VERSION}}"
      # The oldest macOS it is for: packaging/macos/Info.plist says the same.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    cmds:
      # The web client the app has inside, as GoReleaser's builds do.
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} OUT=target-release/desktop-web ./scripts/build-web.sh > /dev/null
      - >-
        TAURI_CONFIG='{"version":"{{.VERSION}}","build":{"frontendDist":"../../target-release/desktop-web"}}'
        cargo build --release --locked --target aarch64-apple-darwin -p notekpr-cli -p notekpr-desktop
      - >-
        packaging/macos/package.sh {{.VERSION}}
        target/aarch64-apple-darwin/release/notekpr-desktop target/aarch64-apple-darwin/release/notekpr
        dist/clients

  ci:macos:
    desc: "On a Mac: every Rust test, then the macOS release files as a snapshot (build:macos), publishing nothing — GitHub's macOS runner runs it when .github/workflows/macos.yml is started without a tag (gh workflow run macos.yml)"
    cmds:
      - task: test
      - task: build:macos

  test:packages:
    desc: "Install the CLI's .deb in Debian and its .rpm in AlmaLinux 8 (glibc 2.28, the oldest the builds run on), the desktop app's .deb in Ubuntu 22.04 (the oldest it is for) and Debian and its .rpm in Fedora, and check them: for amd64, and for arm64 where Docker can run it (qemu) — after build:clients"
    preconditions:
      - sh: ls dist/clients/*.deb dist/clients/*.rpm > /dev/null 2>&1
        msg: "No packages in dist/clients: task build:clients first"
    cmds:
      # The desktop app's with what they depend on from each system's own
      # packages. Each architecture's own files: dpkg and uname name them.
      - |
        set -eu
        for platform in linux/amd64 linux/arm64; do
          if ! docker run --rm --platform "$platform" debian:stable-slim true > /dev/null 2>&1; then
            echo "test:packages: Docker can't run $platform here (it needs qemu-user and binfmt): skipped"
            continue
          fi
          echo "test:packages: $platform"
          run() { docker run --rm --platform "$platform" -v "$PWD/dist/clients:/p:ro" "$@"; }
          run debian:stable-slim sh -c 'dpkg -i /p/notekpr-cli_*_$(dpkg --print-architecture).deb > /dev/null && {{.PACKAGE_CHECK}}'
          run almalinux:8 sh -c 'rpm -i /p/notekpr-cli-*.$(uname -m).rpm && {{.PACKAGE_CHECK}}'
          for image in ubuntu:22.04 debian:stable-slim; do
            run "$image" sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /p/notekpr-desktop_*_$(dpkg --print-architecture).deb desktop-file-utils > /dev/null && {{.DESKTOP_PACKAGE_CHECK}} && desktop-file-validate /usr/share/applications/md.notekpr.Notekpr.desktop'
          done
          run fedora:latest sh -c 'dnf -y -q install /p/notekpr-desktop-*.$(uname -m).rpm > /dev/null && {{.DESKTOP_PACKAGE_CHECK}}'
        done

  test:srpm:
    desc: "Build the CLI and the desktop app from dist/clients' source RPMs in Fedora (FEDORA=latest), as COPR does, install them and run them — after build:clients (their source is the last commit, as GoReleaser's source archive is)"
    vars:
      FEDORA: '{{.FEDORA | default "latest"}}'
    preconditions:
      - sh: ls dist/clients/*.src.rpm > /dev/null 2>&1
        msg: "No source RPM in dist/clients: task build:clients first"
    cmds:
      - >-
        docker run --rm -v "$PWD/dist/clients:/srpm:ro" fedora:{{.FEDORA}}
        sh -c 'dnf -y -q install rpm-build "dnf-command(builddep)" > /dev/null
        && dnf -y -q builddep /srpm/*.src.rpm > /dev/null
        && rpmbuild --rebuild --quiet /srpm/*.src.rpm
        && dnf -y -q install ~/rpmbuild/RPMS/*/*.rpm > /dev/null
        && {{.PACKAGE_CHECK}} && {{.DESKTOP_PACKAGE_CHECK}}'

  tools:copr:
    desc: "Install copr-cli {{.COPR_CLI_VERSION}}, which task release publishes to Fedora's COPR with, by pipx (or your distribution's copr-cli)"
    cmds:
      - pipx install "copr-cli=={{.COPR_CLI_VERSION}}"

  copr:project:
    desc: "Create the COPR project the CLI and the desktop app are built in ({{.COPR_PROJECT}}), once, with copr-cli's configuration in ~/.config/copr: every Fedora release and rawhide, amd64 and arm64, new releases as Fedora branches them, internet access during builds (cargo fetches the crates)"
    preconditions:
      - sh: command -v copr-cli
        msg: "copr-cli is missing (Arch: sudo pacman -S copr-cli; or task tools:copr)"
    cmds:
      - >-
        copr-cli create {{.COPR_PROJECT}}
        $(copr-cli list-chroots | awk '$1 ~ /^fedora-([0-9]+|rawhide)-(x86_64|aarch64)$/ { printf " --chroot %s", $1 }')
        --follow-fedora-branching on --enable-net on
        --description "notekpr's command-line client and desktop app: end-to-end encrypted, local-first Markdown notes. https://github.com/coolapso/notekpr"
        --instructions "sudo dnf copr enable {{.COPR_PROJECT}} && sudo dnf install notekpr-desktop (the app) or notekpr-cli (the command line)"

  # ------------------------------------------------------------------ the desktop app's Flatpak
  # flatpak-builder with Flathub's GNOME runtime and Rust extension, installed
  # for your user (packaging/flatpak, docs/development.md "The Flatpak").

  flatpak:deps:
    desc: "Install or update, for your user, what the desktop app's Flatpak is built with: the GNOME {{.FLATPAK_GNOME}} runtime and SDK, the Rust extension and Flathub's own builder (its linter); a few GB"
    cmds:
      - flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - >-
        flatpak install --user -y --noninteractive --or-update flathub
        org.gnome.Sdk//{{.FLATPAK_GNOME}} org.gnome.Platform//{{.FLATPAK_GNOME}}
        org.freedesktop.Sdk.Extension.rust-stable//{{.FLATPAK_FREEDESKTOP}} org.flatpak.Builder

  build:flatpak:
    desc: "Build the desktop app's Flatpak from this checkout as it is, as Flathub does (its flathub-build: store pictures fetched from GitHub's main), into target-release/flatpak (repo/, builddir/), nothing installed — after flatpak:deps"
    cmds:
      - task: flatpak:deps
      - packaging/flatpak/generate.py target-release/flatpak --local
      - cd target-release/flatpak && flatpak run --command=flathub-build org.flatpak.Builder md.notekpr.Notekpr.yml

  test:flatpak:
    desc: "Check the desktop app's Flatpak as Flathub does (its linter, on the manifest and the build: its store pictures must be on GitHub's main), run it and check what it holds — after build:flatpak"
    dir: target-release/flatpak
    cmds:
      - flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest md.notekpr.Notekpr.yml
      - flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
      # The app runs, with the tray's library beside it and nothing of the build's own left.
      - flatpak build builddir notekpr-desktop --version
      - >-
        flatpak build builddir sh -c 'test -e /app/lib/libayatana-appindicator3.so.1
        && test -e /app/share/metainfo/md.notekpr.Notekpr.metainfo.xml && ! test -e /app/tools'

  release:flatpak:
    desc: "The desktop app's Flatpak as one file, for the release tagged at HEAD (release:clients makes it, and GoReleaser attaches it): built as Flathub builds it, from that tag on GitHub, into target-release/flatpak-release/notekpr-desktop_<version>_<arch>.flatpak"
    vars:
      TAG:
        sh: git describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true
    preconditions:
      - sh: test -n "{{.TAG}}"
        msg: "HEAD has no release tag: the Flatpak file is made for a release (task release)"
    cmds:
      - task: flatpak:deps
      - packaging/flatpak/generate.py target-release/flatpak-release --tag {{.TAG}}
      - |
        set -eu
        cd target-release/flatpak-release
        flatpak run --command=flathub-build org.flatpak.Builder md.notekpr.Notekpr.yml
        # On the branch apps are installed from (stable), not the build's own (master).
        arch=$(flatpak --default-arch)
        flatpak build-commit-from --src-ref="app/md.notekpr.Notekpr/$arch/master" repo "app/md.notekpr.Notekpr/$arch/stable"
        rm -f notekpr-desktop_*.flatpak
        # Installing it fetches GNOME's runtime from Flathub.
        flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
          repo "notekpr-desktop_{{trimPrefix "v" .TAG}}_$arch.flatpak" md.notekpr.Notekpr stable

  # ------------------------------------------------------------------ docker

  docker:login:
    desc: "Login to GHCR"
    cmds:
      - |
        if [[ -z $GHCR_PASSWORD ]]; then
           GHCR_PASSWORD=$(infisical secrets get --plain \
             --domain="https://eu.infisical.com" \
             --projectId {{.CI_INFISICAL_PROJECT_ID}} \
             --env ci ghcr)
        fi
        echo $GHCR_PASSWORD | docker login ghcr.io -u coolapso --password-stdin

  docker:build:
    desc: Build the container image notekpr:latest
    cmds:
      - docker build -t notekpr:latest .

  docker:build:demo:
    desc: "Build the public demo image (notekpr-demo:latest): seeds the demo, serves it an hour, exits to start over — docs/operations.md §10"
    cmds:
      - docker build --target demo -t notekpr-demo:latest .

  docker:test:demo:
    desc: "Seed the demo in notekpr-demo:latest the way Kubernetes runs it (deploy/kubernetes/demo.yaml), then stop"
    cmds:
      # As the manifest: not root, no capabilities, nothing writable but /data
      # and /tmp (the server refuses to start without a writable /tmp).
      - >-
        docker run --rm --read-only --user 65532:65532 --cap-drop ALL
        --security-opt no-new-privileges --tmpfs /data:size=1g,uid=65532,gid=65532
        --tmpfs /tmp:size=1g,uid=65532,gid=65532
        notekpr-demo:latest --seed-only

  docker:push:
    desc: "Build the image for amd64 and arm64 and push it to ghcr.io/coolapso/notekpr, tagged with the version and latest (the version: the latest release tag, -dev with uncommitted changes; or VERSION=x.y.z)"
    deps: [docker:login]
    cmds:
      - task: docker:push:image
        vars:
          IMAGE: ghcr.io/coolapso/notekpr
          VERSION: "{{.VERSION}}"

  docker:push:demo:
    desc: "Like docker:push, for the public demo image: ghcr.io/coolapso/notekpr-demo"
    deps: [docker:login]
    cmds:
      - task: docker:push:image
        vars:
          IMAGE: ghcr.io/coolapso/notekpr-demo
          TARGET: demo
          VERSION: "{{.VERSION}}"

  docker:push:image:
    internal: true
    vars:
      PLATFORMS: linux/amd64,linux/arm64
    cmds:
      - |
        set -eu
        version='{{.VERSION}}'
        if [ -z "$version" ]; then
          # The latest release tag: 0.2.0 on it, 0.2.0-3-gabc1234 three
          # commits after it (just the commit hash before the first release),
          # with -dev if there are uncommitted changes.
          git fetch --tags --quiet origin
          version=$(git describe --tags --always --dirty=-dev)
          version=${version#v}
        fi
        echo "pushing {{.IMAGE}}:$version"
        docker buildx build --push --platform {{.PLATFORMS}} {{if .TARGET}}--target {{.TARGET}}{{end}} \
          --build-arg VERSION="$version" \
          -t "{{.IMAGE}}:$version" -t {{.IMAGE}}:latest .

  docker:dev:
    desc: Run the development server in Docker on http://localhost:8080 (no OIDC)
    cmds:
      - docker compose -f docker-compose.dev.yml up --build

  docker:dev:oidc:
    desc: Like docker:dev, plus a local Dex identity provider and an OIDC-enabled server on http://localhost:8081
    cmds:
      - docker compose -f docker-compose.dev.yml --profile oidc up --build

  docker:dev:down:
    desc: Stop the Docker development stack (data volumes are kept)
    cmds:
      - docker compose -f docker-compose.dev.yml --profile oidc down

  # ------------------------------------------------------------------ release
  # semrel (.semrel.yaml) picks the next version from the Conventional
  # Commits since the last tag, tags it and creates the GitHub Release; then
  # both images are pushed with that version. `--env-file ""`: semrel reads
  # a .env file by default, settings come from the environment instead.
  # The version is chosen with VERSION=, not `-- …`: CLI_ARGS reach every
  # task, also the tests in ci:check.

  tools:release:
    desc: "Install the pinned semrel release tool (needs Go): go install …/semrel@{{.SEMREL_VERSION}}"
    cmds:
      - go install github.com/SemRels/semrel/cmd/semrel@{{.SEMREL_VERSION}}

  release:plugins:
    desc: Download the semrel plugins pinned in .semrel.lock into .semrel/
    cmds:
      - semrel plugin restore --env-file ""

  release:check:
    desc: "Run CI's checks and preview the next release without changing GitHub or git (VERSION=x.y.z to choose the version)"
    preconditions:
      - sh: command -v semrel
        msg: "semrel is missing: task tools:release"
      - sh: command -v jq
        msg: "jq is needed to read semrel's release metadata (Arch: sudo pacman -S jq)"
      - sh: test -x .semrel/plugins/semrel-plugin-git && test -x .semrel/plugins/semrel-plugin-github
        msg: "The release plugins are missing: task release:plugins"
      - sh: 'test -n "${SEMREL_PLUGIN_TOKEN:-${GITHUB_TOKEN:-}}" || gh auth status >/dev/null 2>&1'
        msg: Set SEMREL_PLUGIN_TOKEN or GITHUB_TOKEN, or sign in with gh auth login before releasing.
      - sh: command -v flatpak
        msg: "flatpak is missing, which builds the desktop app's Flatpak for the release (Arch: sudo pacman -S flatpak; then task flatpak:deps)"
      - sh: command -v copr-cli
        msg: "copr-cli is missing, which publishes the CLI to Fedora's COPR (Arch: sudo pacman -S copr-cli; or task tools:copr)"
      - sh: 'test -n "${COPR_CONFIG:-}${CI:-}" || test -f ~/.config/copr'
        msg: "No configuration for copr-cli: save the one https://copr.fedorainfracloud.org/api/ gives you as ~/.config/copr"
      # The docs site goes out last (docs:deploy): wrangler is checked now,
      # so that a release doesn't stop there with everything else published.
      - sh: command -v wrangler >/dev/null
        msg: "wrangler is missing, which publishes the docs site (Arch: wrangler)"
      - sh: 'test -n "${CLOUDFLARE_API_TOKEN:-}" || wrangler whoami 2>/dev/null | grep -q "You are logged in"'
        msg: "wrangler isn't signed in, so the docs site couldn't be published: wrangler login (or CLOUDFLARE_API_TOKEN in the environment)"
    deps: [ci:check]
    cmds:
      - semrel config validate --env-file ""
      - packaging/run.sh goreleaser check
      # Only commits since the last release: the history before the first
      # one predates Conventional Commits.
      - |
        if git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
          semrel lint --env-file ""
        fi
      - task: release:run
        vars:
          FLAGS: --dry-run

  release:run:
    internal: true
    cmds:
      - |
        set -eu
        if [ -z "${SEMREL_PLUGIN_TOKEN:-}" ]; then
          SEMREL_PLUGIN_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}"
          export SEMREL_PLUGIN_TOKEN
        fi
        metadata=$(mktemp "${TMPDIR:-/tmp}/notekpr-release.XXXXXX.json")
        trap 'rm -f "$metadata"' EXIT
        semrel release --env-file "" {{.FLAGS}} {{if .VERSION}}--next-version {{.VERSION}}{{end}} --output-file "$metadata"
        if jq -e '.released == true and .dry_run == false' "$metadata" >/dev/null; then
          version=$(jq -er '.version' "$metadata")
          task docker:push VERSION="$version"
          task docker:push:demo VERSION="$version"
          task release:clients
          # Last, once the release is out: the docs site.
          task docs:deploy
        else
          echo 'No release published; skipping the images, the CLI and the docs site.'
        fi

  release:
    desc: "Release from main: CI's checks, then tag the next version, create the GitHub Release, push both images, publish the CLI with it and, last, the docs site (VERSION=x.y.z to choose the version; the first one: task release VERSION=0.1.0)"
    deps: [release:check, release:prepare]
    cmds:
      - task: release:run
        vars:
          FLAGS: ""

  release:clients:
    desc: "Publish the CLI and the desktop app for the release tagged at HEAD (task release does, after the images; run it again if it failed there): their files and packages on the GitHub Release (the app's Flatpak too: release:flatpak), the AUR packages, the COPR builds (release:copr), then the macOS files (release:macos:dispatch)"
    preconditions:
      - sh: git describe --exact-match --tags --match 'v[0-9]*' HEAD
        msg: "HEAD has no release tag: the CLI is published for a release (task release)"
      - sh: 'test -n "${GITHUB_TOKEN:-}" || gh auth status >/dev/null 2>&1'
        msg: Set GITHUB_TOKEN, or sign in with gh auth login.
    cmds:
      # The Flatpak as a file, which GoReleaser attaches to the release.
      - task: release:flatpak
      # The AUR's SSH key, its contents in AUR_KEY: in CI the `aur` secret
      # from Infisical; elsewhere the key your ssh uses for the AUR (the first
      # of `ssh -G aur.archlinux.org`'s identity files there is), or the file
      # AUR_KEY_FILE names. It must have no passphrase: GoReleaser can't ask.
      - |
        set -eu
        GITHUB_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}"
        export GITHUB_TOKEN
        if [ -z "${AUR_KEY:-}" ]; then
          if [ -n "${CI:-}" ]; then
            AUR_KEY=$(infisical secrets get --plain \
              --domain="https://eu.infisical.com" \
              --projectId {{.CI_INFISICAL_PROJECT_ID}} \
              --env ci aur)
          else
            key=${AUR_KEY_FILE:-}
            if [ -z "$key" ]; then
              for f in $(ssh -G aur.archlinux.org 2>/dev/null | awk '$1 == "identityfile" { print $2 }'); do
                case $f in "~/"*) f=$HOME/${f#"~/"} ;; esac
                if [ -f "$f" ]; then key=$f; break; fi
              done
            fi
            if [ -z "$key" ]; then
              echo "No SSH key for the AUR: set AUR_KEY_FILE" >&2
              exit 1
            fi
            AUR_KEY=$(cat "$key")
          fi
          export AUR_KEY
        fi
        packaging/run.sh goreleaser release --clean
      - packaging/run.sh packaging/rpm/srpm.sh dist/clients
      - task: release:copr
      # Last: the macOS files come from GitHub's macOS runner.
      - task: release:macos:dispatch

  release:macos:
    desc: "On a Mac: the macOS release files for the release tagged at HEAD (build:macos), attached to its GitHub Release with their checksums (notekpr_<version>_macos_checksums.txt) — GitHub's macOS runner runs this (release:macos:dispatch)"
    vars:
      TAG:
        sh: git describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true
      VERSION: '{{trimPrefix "v" .TAG}}'
    preconditions:
      - sh: test -n "{{.TAG}}"
        msg: "HEAD has no release tag: the macOS files are made for a release (task release)"
      - sh: 'test -n "${GH_TOKEN:-}${GITHUB_TOKEN:-}" || gh auth status >/dev/null 2>&1'
        msg: Set GITHUB_TOKEN, or sign in with gh auth login.
    cmds:
      - task: build:macos
        vars:
          VERSION: "{{.VERSION}}"
      # Their checksums in a list of their own, beside GoReleaser's, which
      # stays as it is (replacing it would delete it first). Run again, it
      # all is made and replaced anew.
      - |
        set -eu
        cd dist/clients
        files="notekpr-desktop_{{.VERSION}}_darwin_arm64.dmg notekpr-cli_{{.VERSION}}_darwin_arm64.tar.gz"
        sums=notekpr_{{.VERSION}}_macos_checksums.txt
        shasum -a 256 $files > "$sums"
        gh release upload {{.TAG}} --repo coolapso/notekpr --clobber $files "$sums"

  release:macos:dispatch:
    desc: "Have GitHub's macOS runner make the macOS release files for the release tagged at HEAD and attach them (.github/workflows/macos.yml runs release:macos), and wait for it — release:clients does, last; run it again if it failed there"
    vars:
      TAG:
        sh: git describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true
    preconditions:
      - sh: test -n "{{.TAG}}"
        msg: "HEAD has no release tag: the macOS files are made for a release (task release)"
      - sh: 'test -n "${GH_TOKEN:-}${GITHUB_TOKEN:-}" || gh auth status >/dev/null 2>&1'
        msg: Set GITHUB_TOKEN, or sign in with gh auth login.
    cmds:
      - |
        set -eu
        repo=coolapso/notekpr
        since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        gh workflow run macos.yml --repo "$repo" --ref {{.TAG}} -f tag={{.TAG}}
        # The run just asked for: the workflow's newest for this tag since.
        id=
        for _ in $(seq 30); do
          id=$(gh run list --repo "$repo" --workflow macos.yml --event workflow_dispatch --created ">=$since" \
            --json databaseId,displayTitle --jq 'map(select(.displayTitle | endswith(" {{.TAG}}")))[0].databaseId // empty')
          [ -n "$id" ] && break
          sleep 2
        done
        if [ -z "$id" ]; then
          echo "The macOS build didn't start: gh run list --repo $repo --workflow macos.yml" >&2
          exit 1
        fi
        echo "The macOS build: https://github.com/$repo/actions/runs/$id"
        gh run watch "$id" --repo "$repo" --exit-status > /dev/null

  release:copr:
    desc: "Have COPR ({{.COPR_PROJECT}}) build the CLI and the desktop app from dist/clients' source RPMs and wait for them — release:clients does, after GoReleaser"
    preconditions:
      - sh: command -v copr-cli
        msg: "copr-cli is missing (Arch: sudo pacman -S copr-cli; or task tools:copr)"
      - sh: ls dist/clients/*.src.rpm > /dev/null 2>&1
        msg: "No source RPM in dist/clients: task release:clients first"
    cmds:
      # copr-cli's configuration (its API token): COPR_CONFIG's contents if
      # set; in CI the `copr` secret from Infisical; elsewhere your own,
      # ~/.config/copr. Builds get internet access: cargo fetches the
      # crates Cargo.lock pins. Ctrl+C stops waiting, not the builds.
      - |
        set -eu
        if [ -z "${COPR_CONFIG:-}" ] && [ -n "${CI:-}" ]; then
          COPR_CONFIG=$(infisical secrets get --plain \
            --domain="https://eu.infisical.com" \
            --projectId {{.CI_INFISICAL_PROJECT_ID}} \
            --env ci copr)
        fi
        config=$HOME/.config/copr
        if [ -n "${COPR_CONFIG:-}" ]; then
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config"
        elif [ ! -f "$config" ]; then
          echo "No configuration for copr-cli: save the one https://copr.fedorainfracloud.org/api/ gives you as ~/.config/copr" >&2
          exit 1
        fi
        copr-cli --config "$config" build --enable-net on {{.COPR_PROJECT}} dist/clients/*.src.rpm

  release:prepare:
    internal: true
    cmds:
      - 'git config user.name >/dev/null || git config user.name "${GIT_RELEASE_NAME:-github-actions[bot]}"'
      - 'git config user.email >/dev/null || git config user.email "${GIT_RELEASE_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"'

  # ------------------------------------------------------------------ load test

  build:load-ui:
    desc: Build the load test's live dashboard into dist/load
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
    cmds:
      - ./scripts/build-load-ui.sh > /dev/null
    silent: true

  load:
    desc: "Load test with a live view on http://localhost:8098 (a start screen to choose the run): levels of people (100 → 1000) against the server image with CPU and memory limits, each level with a longer outage; FROM=6 starts at level 6, REALISTIC=1 makes people as busy as real ones (USERS=100 STEP=100 LEVELS=10 FROM=1 DURATION=45s CPUS=1 MEMORY=512m SPEED=1)"
    deps: [docker:build, build:load-ui]
    vars:
      USERS: '{{.USERS | default "100"}}'
      STEP: '{{.STEP | default "100"}}'
      LEVELS: '{{.LEVELS | default "10"}}'
      FROM: '{{.FROM | default "1"}}'
      DURATION: '{{.DURATION | default "45s"}}'
      CPUS: '{{.CPUS | default "1"}}'
      MEMORY: '{{.MEMORY | default "512m"}}'
      SPEED: '{{.SPEED | default "1"}}'
      REALISTIC: '{{.REALISTIC | default ""}}'
    cmds:
      - cargo build --release -p notekpr-load
      - ./target/release/notekpr-load --open --users {{.USERS}} --step {{.STEP}} --levels {{.LEVELS}} --from-level {{.FROM}} --duration {{.DURATION}} --speed {{.SPEED}} --cpus {{.CPUS}} --memory {{.MEMORY}} {{if .REALISTIC}}--realistic{{end}} {{.CLI_ARGS}}

  load:remote:
    desc: "Like load, against a server elsewhere: SERVER=https://… (a throwaway one in development mode with raised rate limits, see docs/load-test.md); no outages unless -- --kill-command … --start-command … (USERS=100 STEP=100 LEVELS=10 FROM=1 DURATION=45s SPEED=1 REALISTIC=)"
    deps: [build:load-ui]
    requires:
      vars: [SERVER]
    vars:
      USERS: '{{.USERS | default "100"}}'
      STEP: '{{.STEP | default "100"}}'
      LEVELS: '{{.LEVELS | default "10"}}'
      FROM: '{{.FROM | default "1"}}'
      DURATION: '{{.DURATION | default "45s"}}'
      SPEED: '{{.SPEED | default "1"}}'
      REALISTIC: '{{.REALISTIC | default ""}}'
    cmds:
      - cargo build --release -p notekpr-load
      - ./target/release/notekpr-load --server {{.SERVER}} --open --users {{.USERS}} --step {{.STEP}} --levels {{.LEVELS}} --from-level {{.FROM}} --duration {{.DURATION}} --speed {{.SPEED}} {{if .REALISTIC}}--realistic{{end}} {{.CLI_ARGS}}

  load:native:
    desc: "Like load, without Docker: the server as a local process, no limits (USERS=100 STEP=100 LEVELS=10 FROM=1 DURATION=45s SPEED=1 REALISTIC=)"
    deps: [build:load-ui, build:web]
    vars:
      USERS: '{{.USERS | default "100"}}'
      STEP: '{{.STEP | default "100"}}'
      LEVELS: '{{.LEVELS | default "10"}}'
      FROM: '{{.FROM | default "1"}}'
      DURATION: '{{.DURATION | default "45s"}}'
      SPEED: '{{.SPEED | default "1"}}'
      REALISTIC: '{{.REALISTIC | default ""}}'
    cmds:
      - cargo build --release -p notekpr-server -p notekpr-load
      - ./target/release/notekpr-load --native --open --users {{.USERS}} --step {{.STEP}} --levels {{.LEVELS}} --from-level {{.FROM}} --duration {{.DURATION}} --speed {{.SPEED}} {{if .REALISTIC}}--realistic{{end}} {{.CLI_ARGS}}

  # ------------------------------------------------------------------ housekeeping

  clean:
    desc: Remove build outputs (keeps the dev database)
    cmds:
      - cargo clean
      - rm -rf {{.WEB_TARGET_DIR}} dist

  clean:worktrees:
    desc: Remove the git worktrees whose work is all on main (parallel agents'; each holds its own build outputs)
    cmds:
      - scripts/clean-worktrees.sh
