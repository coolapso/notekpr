[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/server", "crates/client", "crates/web"]
# The web crate only makes sense for wasm32; build it with scripts/build-web.sh.
default-members = ["crates/core", "crates/sync", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/coolapso/coolpsonotes"
rust-version = "1.94"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Small, fast WebAssembly for the browser client.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
