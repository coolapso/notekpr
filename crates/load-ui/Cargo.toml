[package]
name = "coolpsonotes-load-ui"
description = "Live dashboard of the coolpsonotes load test (Rust, compiled to WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coolpsonotes-load-events = { path = "../load-events" }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "TextMetrics", "WebSocket", "MessageEvent", "CloseEvent", "Event", "Location", "Performance",
  "CanvasGradient", "console",
]
