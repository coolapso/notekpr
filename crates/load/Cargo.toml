[package]
name = "notekpr-load"
description = "Load test with a live dashboard: simulated people, real clients, against a real server with CPU and memory limits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "notekpr-load"
path = "src/main.rs"

[dependencies]
notekpr-client = { path = "../client" }
notekpr-core = { path = "../core" }
notekpr-load-events = { path = "../load-events" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.8"
data-encoding = "2.11"
libc = "0.2"
