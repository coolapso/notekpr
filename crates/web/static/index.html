<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget: an on-screen keyboard makes the page shorter
       instead of sliding it up, which took the header out of view. iOS
       ignores it: there the app follows what shows (viewport.rs). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f1d2b">
  <title>notekpr</title>
  <!-- What a link to the server shows when it is shared (chats, social
       networks): the same for every address, nothing of the server's or of
       its notes. They want whole addresses: the server puts its public URL
       in front of each content="/…" (crates/server/src/page.rs). The
       picture is drawn from scripts/social-card.html (task web:card). -->
  <meta name="description" content="Markdown notes, drawings and live collaboration, end-to-end encrypted: the server only stores ciphertext.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="notekpr">
  <meta property="og:title" content="notekpr · Notes only you can read">
  <meta property="og:description" content="Markdown notes, drawings and live collaboration, end-to-end encrypted: the server only stores ciphertext.">
  <meta property="og:image" content="/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="notekpr: Write anything. The server only sees noise. A note, and the ciphertext that is all the server ever gets.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/fonts/drawing-fonts.css">
  <script type="module" src="/boot.js"></script>
</head>
<body>
  <div id="boot" class="center-fill"><div class="spinner"></div></div>
  <noscript>notekpr needs JavaScript and WebAssembly to encrypt your notes on this device.</noscript>
</body>
</html>
