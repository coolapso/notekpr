# Common development tasks. Requires go-task v3 (https://taskfile.dev).
#   task            list tasks
#   task dev        run a development server (no OIDC, sign in as any user name)
#   task test       run all Rust tests
version: "3"

vars:
  CI_INFISICAL_PROJECT_ID: "7897aa98-f8e5-40f2-a83d-f4926cdba05b"
  CLI_INFISICAL_PROJECT_ID: "4f12d18e-e075-4a6c-ba6c-367bec3e62e7"
  LISTEN: 127.0.0.1:8080
  PUBLIC_URL: http://localhost:8080
  DATA_DIR: data
  # `task dev`'s admin client "dev" (every scope): a fixed token, fine for a
  # development server on this machine only; another one with
  # `task dev DEV_ADMIN_TOKEN=notekpr_a_…`.
  DEV_ADMIN_TOKEN: notekpr_a_dev-admin-token-for-this-machine-only
  # `task demo`: its own server, database and CLI profiles, next to `task dev`.
  DEMO_LISTEN: 127.0.0.1:8099
  DEMO_DIR: data/demo
  BACKUP_DIR: backups
  # The web client is built in its own target directory so native and wasm
  # builds don't keep invalidating each other's dependencies.
  WEB_TARGET_DIR: target-web
  WASM_BINDGEN_VERSION:
    sh: sed -nE 's/^wasm-bindgen = "=([0-9.]+)".*/\1/p' crates/web/Cargo.toml
  RUST_VERSION:
    sh: sed -nE 's/^rust-version = "([0-9.]+)".*/\1/p' Cargo.toml
  # The release tool (`task release`); its plugins are pinned in .semrel.lock.
  # At least v0.27.0: older ones ignore .semrel.yaml's rules for build and
  # refactor commits (they release only for feat, fix, perf and revert).
  SEMREL_VERSION: v0.28.2

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ------------------------------------------------------------------ setup

  setup:
    desc: Check the toolchain (Rust, wasm32 target, wasm-bindgen CLI, test tools) and say how to get what's missing
    silent: true
    cmds:
      - cmd: |
          ok=1
          if ! v=$(rustc --version 2>/dev/null | awk '{print $2}') || [ -z "$v" ]; then
            echo "✗ no working Rust compiler (Arch: sudo pacman -S rust)"; ok=0
          else
            if [ "$(printf '%s\n' "{{.RUST_VERSION}}" "$v" | sort -V | head -1)" = "{{.RUST_VERSION}}" ]; then
              echo "✓ rustc $v"
            else
              echo "✗ rustc $v is older than {{.RUST_VERSION}}"; ok=0
            fi
            if [ -d "$(rustc --print sysroot)/lib/rustlib/wasm32-unknown-unknown" ]; then
              echo "✓ wasm32-unknown-unknown target"
            else
              echo "✗ wasm32-unknown-unknown target missing (Arch: sudo pacman -S rust-wasm; rustup: rustup target add wasm32-unknown-unknown)"; ok=0
            fi
          fi
          have=$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')
          if [ "$have" = "{{.WASM_BINDGEN_VERSION}}" ]; then
            echo "✓ wasm-bindgen $have"
          else
            echo "✗ wasm-bindgen CLI {{.WASM_BINDGEN_VERSION}} needed, found ${have:-none}"
            echo "    Arch: sudo pacman -S wasm-bindgen (if it is {{.WASM_BINDGEN_VERSION}}), otherwise:"
            echo "    cargo install wasm-bindgen-cli --version {{.WASM_BINDGEN_VERSION}} --locked   (~/.cargo/bin must come first in PATH)"
            ok=0
          fi
          command -v wasm-opt >/dev/null && echo "✓ wasm-opt (smaller release builds)" || echo "· optional: wasm-opt for smaller release builds (Arch: binaryen)"
          if command -v chromedriver >/dev/null && command -v python3 >/dev/null; then
            echo "✓ chromedriver + python3 (browser tests)"
          else
            echo "· for the browser tests (task test:e2e, task test:editor, task ci): chromium with chromedriver, and python3 (Arch: chromium python)"
          fi
          command -v cargo-deny >/dev/null && echo "✓ cargo-deny (task audit)" || echo "· for task audit and task ci: cargo-deny (Arch: cargo-deny; or cargo install cargo-deny --locked)"
          command -v docker >/dev/null && echo "✓ docker (container image, Docker dev stack)" || echo "· for the docker:* tasks, task load and task ci: docker + compose (Arch: docker docker-compose docker-buildx)"
          command -v semrel >/dev/null && command -v jq >/dev/null && echo "✓ semrel + jq (task release)" || echo "· for task release: semrel (task tools:release, needs Go) and jq (Arch: jq)"
          [ "$ok" = 1 ]

  rust:
    internal: true
    run: once
    preconditions:
      - sh: cargo --version > /dev/null 2>&1
        msg: "cargo doesn't work. Run `task setup` to see what's missing (with rustup but no toolchain: reinstall your distribution's Rust, on Arch `sudo pacman -S rust`, or run `rustup default stable`)."

  # ------------------------------------------------------------------ build

  build:
    desc: Build the server, the CLI and the web client (debug)
    deps: [build:server, build:cli, build:web:dev]

  build:server:
    desc: Build the server (debug)
    deps: [rust]
    cmds:
      - cargo build -p notekpr-server

  build:cli:
    desc: Build the CLI `notekpr` (debug)
    deps: [rust]
    cmds:
      - cargo build -p notekpr-cli

  build:web:
    desc: Build the optimized web client into dist/web
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
    cmds:
      - ./scripts/build-web.sh

  build:web:dev:
    desc: Build the web client quickly (unoptimized) into dist/web
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
      PROFILE: dev
    cmds:
      - ./scripts/build-web.sh > /dev/null
      - echo "web client (dev) built into dist/web"
    silent: true

  build:release:
    desc: Release build of the server and CLI (target/release) plus the optimized web client
    deps: [rust]
    cmds:
      - cargo build --release --locked -p notekpr-server -p notekpr-cli
      - task: build:web

  # ------------------------------------------------------------------ run

  dev:
    desc: "Run the server in development mode on {{.PUBLIC_URL}}: no OIDC, sign in as any user (one per browser tab)"
    deps: [build:server, build:web:dev]
    vars:
      ADMINLESS: '{{.ADMINLESS | default "false"}}'
    cmds:
      - cmd: echo "{{.DEV_ADMIN_TOKEN}}" | ./target/debug/notekpr-server --data-dir {{.DATA_DIR}} admin-client ensure --name dev --scopes all --tokens-file -
        silent: true
      - cmd: 'echo "admin client: curl -H \"Authorization: Bearer {{.DEV_ADMIN_TOKEN}}\" {{.PUBLIC_URL}}/api/v1/admin/settings"'
        silent: true
      - ./target/debug/notekpr-server --dev-mode --adminless {{.ADMINLESS}} --web-dir dist/web --data-dir {{.DATA_DIR}} --listen {{.LISTEN}} --public-url {{.PUBLIC_URL}} --log-format pretty {{.CLI_ARGS}}

  dev:adminless:
    desc: "`task dev` as an admin-less instance: nobody signing in administers anything, only admin clients (the dev one: its curl line) do. Same data as `task dev`"
    cmds:
      - task: dev
        vars: { ADMINLESS: "true" }

  web:watch:
    desc: Rebuild the web client whenever its code changes (run next to `task dev`, then reload the browser)
    watch: true
    method: none
    sources:
      - crates/web/**/*
      - crates/editor/**/*.rs
      - crates/core/**/*.rs
    cmds:
      - task: build:web:dev

  dev:reset:
    desc: Delete the development database (all local test users, vaults and notes)
    prompt: "This deletes everything in {{.DATA_DIR}}/. Continue?"
    cmds:
      - rm -rf {{.DATA_DIR}}

  demo:
    desc: "Run a demo on http://localhost:8099 (another port: DEMO_LISTEN=127.0.0.1:PORT) — users, shared vaults and notes, a linked vault for the graph (created on the first run)"
    deps: [build:server, build:cli, build:web:dev]
    cmds:
      - python3 -u scripts/demo.py --listen {{.DEMO_LISTEN}} --data {{.DEMO_DIR}} {{.CLI_ARGS}}

  demo:reset:
    desc: Delete the demo's data (the next `task demo` creates it again)
    prompt: "This deletes everything in {{.DEMO_DIR}}/. Continue?"
    cmds:
      - rm -rf {{.DEMO_DIR}}

  demo:cli:
    desc: "Run the CLI as a demo user, e.g. `task demo:cli -- --profile bob vault list`"
    deps: [rust]
    env:
      NOTEKPR_CONFIG_DIR: "{{.ROOT_DIR}}/{{.DEMO_DIR}}/cli/config"
      NOTEKPR_DATA_DIR: "{{.ROOT_DIR}}/{{.DEMO_DIR}}/cli/data"
    cmds:
      - cargo run -q -p notekpr-cli -- {{.CLI_ARGS}}

  cli:
    desc: "Run the CLI, e.g. `task cli -- --profile alice status`"
    deps: [rust]
    cmds:
      - cargo run -q -p notekpr-cli -- {{.CLI_ARGS}}

  cli:login:
    desc: "Sign the CLI in to the dev server as a test user, e.g. `task cli:login DEV_USER=alice` (profile = user name)"
    deps: [rust]
    requires:
      vars: [DEV_USER]
    cmds:
      - cargo run -q -p notekpr-cli -- --profile {{.DEV_USER}} login --server {{.PUBLIC_URL}} --dev-user {{.DEV_USER}}

  backup:
    desc: "Write a timestamped backup of {{.DATA_DIR}} into {{.BACKUP_DIR}}/ (safe while the server runs; keeps the newest 10)"
    deps: [build:server]
    cmds:
      - ./target/debug/notekpr-server backup --data-dir {{.DATA_DIR}} --out-dir {{.BACKUP_DIR}} --keep 10

  # ------------------------------------------------------------------ test & lint

  test:
    desc: Run all Rust tests (every crate in the workspace)
    deps: [rust]
    cmds:
      - cargo test --locked --workspace

  test:core:
    desc: Crypto, key hierarchy, CRDT model, protocol
    deps: [rust]
    cmds:
      - cargo test -p notekpr-core

  test:server:
    desc: Server API tests with real client-side crypto
    deps: [rust]
    cmds:
      - cargo test -p notekpr-server

  test:cli:
    desc: Sync engine, Markdown mirror and gateway against an in-process server
    deps: [rust]
    cmds:
      - cargo test -p notekpr-cli

  test:web:
    desc: Safe rendering, zip (natively)
    deps: [rust]
    cmds:
      - cargo test -p notekpr-web

  test:s3:
    desc: "Attachments in S3-compatible storage, against a local Garage in Docker (started and removed by scripts/test-s3.sh)"
    deps: [rust]
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is needed (it runs Garage, an S3-compatible server)"
    cmds:
      - scripts/test-s3.sh {{.CLI_ARGS}}

  fuzz:
    desc: "Fuzz the parsers (stable toolchain, libFuzzer): `task fuzz` (every target, SECS=60 each) or `task fuzz -- zip 300`"
    deps: [rust]
    vars:
      SECS: '{{.SECS | default "60"}}'
    cmds:
      - fuzz/run.sh {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}"" {{.SECS}}{{end}}

  test:editor:
    desc: "The editor: its model natively, then its DOM view in headless Chromium (wasm-bindgen-test; needs chromedriver); `task test:editor -- --nocapture` shows timings"
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    preconditions:
      - sh: '[ "$(wasm-bindgen-test-runner --version 2>/dev/null | awk ''{print $2}'')" = "{{.WASM_BINDGEN_VERSION}}" ]'
        msg: "wasm-bindgen-test-runner {{.WASM_BINDGEN_VERSION}} is needed (it comes with the wasm-bindgen CLI: cargo install wasm-bindgen-cli --version {{.WASM_BINDGEN_VERSION}} --locked)"
      - sh: command -v chromedriver
        msg: "chromedriver is needed (Arch: chromium)"
    cmds:
      - cargo test -p notekpr-editor
      - CHROMEDRIVER="${CHROMEDRIVER:-$(command -v chromedriver)}" cargo test -p notekpr-editor --target wasm32-unknown-unknown --test browser {{.CLI_ARGS}}

  test:e2e:
    desc: "Headless browser tests and browser ↔ CLI test (needs chromium + chromedriver); only some with `task test:e2e -- -k collab` (the browser ↔ CLI tests are cross_client and drawings)"
    deps: [rust]
    cmds:
      - tests/e2e/run.sh {{.CLI_ARGS}}

  fmt:
    desc: Format all Rust code (rustfmt defaults)
    deps: [rust]
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if any Rust code is not formatted
    deps: [rust]
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy on every crate (warnings are errors), including the web client for wasm32
    deps: [rust]
    cmds:
      - cargo clippy --locked -p notekpr-core -p notekpr-draw -p notekpr-server -p notekpr-sync -p notekpr-cli -p notekpr-editor -p notekpr-load-events -p notekpr-load -p notekpr-load-ui --all-targets -- -D warnings
      # The web client's tests run natively.
      - cargo clippy --locked -p notekpr-web --tests -- -D warnings -A clippy::type_complexity
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo clippy --locked -p notekpr-web --target wasm32-unknown-unknown -- -D warnings -A clippy::type_complexity
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo clippy --locked -p notekpr-editor --target wasm32-unknown-unknown --all-targets -- -D warnings
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo clippy --locked -p notekpr-load-ui --target wasm32-unknown-unknown -- -D warnings

  check:wasm:
    desc: Make sure the core crate still builds for the browser
    deps: [rust]
    cmds:
      - CARGO_TARGET_DIR={{.WEB_TARGET_DIR}} cargo build --locked -p notekpr-core --target wasm32-unknown-unknown

  audit:
    desc: Supply-chain checks (licenses, advisories, sources) with cargo-deny
    preconditions:
      - sh: command -v cargo-deny
        msg: "cargo-deny is not installed: cargo install cargo-deny --locked"
    cmds:
      - cargo deny check

  ci:
    desc: "Exactly what CI runs (it installs the tooling, then this): ci:check, ci:image and ci:clients"
    cmds:
      - task: ci:check
      - task: ci:image
      - task: ci:clients

  # CI runs these as separate jobs, ci:image and ci:clients once ci:check
  # passes: one machine's disk (14 GB guaranteed on GitHub's runners) doesn't
  # hold the test builds and the image or release builds.
  ci:check:
    desc: "Format check, lint, every test, the wasm build, the editor's and the browser tests, the supply-chain check"
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: test:s3
      - task: check:wasm
      - task: test:editor
      - task: test:e2e
      - task: audit

  ci:image:
    desc: "The container images: the server's and the public demo's"
    cmds:
      - task: docker:build
      # Shares the build stage: only checks the demo's own layer still builds.
      - task: docker:build:demo
      - task: docker:test:demo

  ci:clients:
    desc: "The CLI's release files and AUR package, without publishing (build:clients)"
    cmds:
      - task: build:clients

  # ------------------------------------------------------------------ CLI packages
  # GoReleaser (.goreleaser.yaml) in the CLI's build image (packaging/Dockerfile,
  # run by packaging/run.sh): Docker is all these need.

  build:clients:
    desc: "Build the CLI's release files into dist/clients without publishing: Linux (amd64, arm64) and AUR's PKGBUILD (in Docker)"
    cmds:
      - packaging/run.sh goreleaser release --snapshot --clean

  # ------------------------------------------------------------------ website

  site:
    desc: "Preview the website (site/) on http://localhost:{{.SITE_PORT}}"
    vars:
      SITE_PORT: '{{.SITE_PORT | default "8090"}}'
    cmds:
      - python3 -m http.server --bind 127.0.0.1 --directory site {{.SITE_PORT}}

  # ------------------------------------------------------------------ docker

  docker:login:
    desc: "Login to GHCR"
    cmds:
      - |
        if [[ -z $GHCR_PASSWORD ]]; then
           GHCR_PASSWORD=$(infisical secrets get --plain \
             --domain="https://eu.infisical.com" \
             --projectId {{.CI_INFISICAL_PROJECT_ID}} \
             --env ci ghcr)
        fi
        echo $GHCR_PASSWORD | docker login ghcr.io -u coolapso --password-stdin

  docker:build:
    desc: Build the container image notekpr:latest
    cmds:
      - docker build -t notekpr:latest .

  docker:build:demo:
    desc: "Build the public demo image (notekpr-demo:latest): seeds the demo, serves it an hour, exits to start over — docs/operations.md §10"
    cmds:
      - docker build --target demo -t notekpr-demo:latest .

  docker:test:demo:
    desc: "Seed the demo in notekpr-demo:latest the way Kubernetes runs it (deploy/kubernetes/demo.yaml), then stop"
    cmds:
      # As the manifest: not root, no capabilities, nothing writable but /data.
      - >-
        docker run --rm --read-only --user 65532:65532 --cap-drop ALL
        --security-opt no-new-privileges --tmpfs /data:size=1g,uid=65532,gid=65532
        notekpr-demo:latest --seed-only

  docker:push:
    desc: "Build the image for amd64 and arm64 and push it to ghcr.io/coolapso/notekpr, tagged with the version and latest (the version: the latest release tag, -dev with uncommitted changes; or VERSION=x.y.z)"
    deps: [docker:login]
    cmds:
      - task: docker:push:image
        vars:
          IMAGE: ghcr.io/coolapso/notekpr
          VERSION: "{{.VERSION}}"

  docker:push:demo:
    desc: "Like docker:push, for the public demo image: ghcr.io/coolapso/notekpr-demo"
    deps: [docker:login]
    cmds:
      - task: docker:push:image
        vars:
          IMAGE: ghcr.io/coolapso/notekpr-demo
          TARGET: demo
          VERSION: "{{.VERSION}}"

  docker:push:image:
    internal: true
    vars:
      PLATFORMS: linux/amd64,linux/arm64
    cmds:
      - |
        set -eu
        version='{{.VERSION}}'
        if [ -z "$version" ]; then
          # The latest release tag: 0.2.0 on it, 0.2.0-3-gabc1234 three
          # commits after it (just the commit hash before the first release),
          # with -dev if there are uncommitted changes.
          git fetch --tags --quiet origin
          version=$(git describe --tags --always --dirty=-dev)
          version=${version#v}
        fi
        echo "pushing {{.IMAGE}}:$version"
        docker buildx build --push --platform {{.PLATFORMS}} {{if .TARGET}}--target {{.TARGET}}{{end}} \
          --build-arg VERSION="$version" \
          -t "{{.IMAGE}}:$version" -t {{.IMAGE}}:latest .

  docker:dev:
    desc: Run the development server in Docker on http://localhost:8080 (no OIDC)
    cmds:
      - docker compose -f docker-compose.dev.yml up --build

  docker:dev:oidc:
    desc: Like docker:dev, plus a local Dex identity provider and an OIDC-enabled server on http://localhost:8081
    cmds:
      - docker compose -f docker-compose.dev.yml --profile oidc up --build

  docker:dev:down:
    desc: Stop the Docker development stack (data volumes are kept)
    cmds:
      - docker compose -f docker-compose.dev.yml --profile oidc down

  # ------------------------------------------------------------------ release
  # semrel (.semrel.yaml) picks the next version from the Conventional
  # Commits since the last tag, tags it and creates the GitHub Release; then
  # both images are pushed with that version. `--env-file ""`: semrel reads
  # a .env file by default, settings come from the environment instead.
  # The version is chosen with VERSION=, not `-- …`: CLI_ARGS reach every
  # task, also the tests in ci:check.

  tools:release:
    desc: "Install the pinned semrel release tool (needs Go): go install …/semrel@{{.SEMREL_VERSION}}"
    cmds:
      - go install github.com/SemRels/semrel/cmd/semrel@{{.SEMREL_VERSION}}

  release:plugins:
    desc: Download the semrel plugins pinned in .semrel.lock into .semrel/
    cmds:
      - semrel plugin restore --env-file ""

  release:check:
    desc: "Run CI's checks and preview the next release without changing GitHub or git (VERSION=x.y.z to choose the version)"
    preconditions:
      - sh: command -v semrel
        msg: "semrel is missing: task tools:release"
      - sh: command -v jq
        msg: "jq is needed to read semrel's release metadata (Arch: sudo pacman -S jq)"
      - sh: test -x .semrel/plugins/semrel-plugin-git && test -x .semrel/plugins/semrel-plugin-github
        msg: "The release plugins are missing: task release:plugins"
      - sh: 'test -n "${SEMREL_PLUGIN_TOKEN:-${GITHUB_TOKEN:-}}" || gh auth status >/dev/null 2>&1'
        msg: Set SEMREL_PLUGIN_TOKEN or GITHUB_TOKEN, or sign in with gh auth login before releasing.
    deps: [ci:check]
    cmds:
      - semrel config validate --env-file ""
      - packaging/run.sh goreleaser check
      # Only commits since the last release: the history before the first
      # one predates Conventional Commits.
      - |
        if git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
          semrel lint --env-file ""
        fi
      - task: release:run
        vars:
          FLAGS: --dry-run

  release:run:
    internal: true
    cmds:
      - |
        set -eu
        if [ -z "${SEMREL_PLUGIN_TOKEN:-}" ]; then
          SEMREL_PLUGIN_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}"
          export SEMREL_PLUGIN_TOKEN
        fi
        metadata=$(mktemp "${TMPDIR:-/tmp}/notekpr-release.XXXXXX.json")
        trap 'rm -f "$metadata"' EXIT
        semrel release --env-file "" {{.FLAGS}} {{if .VERSION}}--next-version {{.VERSION}}{{end}} --output-file "$metadata"
        if jq -e '.released == true and .dry_run == false' "$metadata" >/dev/null; then
          version=$(jq -er '.version' "$metadata")
          task docker:push VERSION="$version"
          task docker:push:demo VERSION="$version"
          task release:clients
        else
          echo 'No release published; skipping image and CLI publishing.'
        fi

  release:
    desc: "Release from main: CI's checks, then tag the next version, create the GitHub Release, push both images and publish the CLI with it (VERSION=x.y.z to choose the version; the first one: task release VERSION=0.1.0)"
    deps: [release:check, release:prepare]
    cmds:
      - task: release:run
        vars:
          FLAGS: ""

  release:clients:
    desc: "Publish the CLI for the release tagged at HEAD (task release does, after the images; run it again if it failed there): its files on the GitHub Release and the AUR package"
    preconditions:
      - sh: git describe --exact-match --tags --match 'v[0-9]*' HEAD
        msg: "HEAD has no release tag: the CLI is published for a release (task release)"
      - sh: 'test -n "${GITHUB_TOKEN:-}" || gh auth status >/dev/null 2>&1'
        msg: Set GITHUB_TOKEN, or sign in with gh auth login.
    cmds:
      # The AUR's SSH key: AUR_KEY, or from Infisical.
      - |
        set -eu
        GITHUB_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}"
        export GITHUB_TOKEN
        if [ -z "${AUR_KEY:-}" ]; then
          AUR_KEY=$(infisical secrets get --plain \
            --domain="https://eu.infisical.com" \
            --projectId {{.CI_INFISICAL_PROJECT_ID}} \
            --env ci aur)
          export AUR_KEY
        fi
        packaging/run.sh goreleaser release --clean

  release:prepare:
    internal: true
    cmds:
      - 'git config user.name >/dev/null || git config user.name "${GIT_RELEASE_NAME:-github-actions[bot]}"'
      - 'git config user.email >/dev/null || git config user.email "${GIT_RELEASE_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"'

  # ------------------------------------------------------------------ load test

  build:load-ui:
    desc: Build the load test's live dashboard into dist/load
    deps: [rust]
    env:
      CARGO_TARGET_DIR: "{{.WEB_TARGET_DIR}}"
    cmds:
      - ./scripts/build-load-ui.sh > /dev/null
    silent: true

  load:
    desc: "Load test with a live view on http://localhost:8098 (a start screen to choose the run): levels of people (100 → 1000) against the server image with CPU and memory limits, each level with a longer outage; FROM=6 starts at level 6, REALISTIC=1 makes people as busy as real ones (USERS=100 STEP=100 LEVELS=10 FROM=1 DURATION=45s CPUS=1 MEMORY=512m SPEED=1)"
    deps: [docker:build, build:load-ui]
    vars:
      USERS: '{{.USERS | default "100"}}'
      STEP: '{{.STEP | default "100"}}'
      LEVELS: '{{.LEVELS | default "10"}}'
      FROM: '{{.FROM | default "1"}}'
      DURATION: '{{.DURATION | default "45s"}}'
      CPUS: '{{.CPUS | default "1"}}'
      MEMORY: '{{.MEMORY | default "512m"}}'
      SPEED: '{{.SPEED | default "1"}}'
      REALISTIC: '{{.REALISTIC | default ""}}'
    cmds:
      - cargo build --release -p notekpr-load
      - ./target/release/notekpr-load --open --users {{.USERS}} --step {{.STEP}} --levels {{.LEVELS}} --from-level {{.FROM}} --duration {{.DURATION}} --speed {{.SPEED}} --cpus {{.CPUS}} --memory {{.MEMORY}} {{if .REALISTIC}}--realistic{{end}} {{.CLI_ARGS}}

  load:remote:
    desc: "Like load, against a server elsewhere: SERVER=https://… (a throwaway one in development mode with raised rate limits, see docs/load-test.md); no outages unless -- --kill-command … --start-command … (USERS=100 STEP=100 LEVELS=10 FROM=1 DURATION=45s SPEED=1 REALISTIC=)"
    deps: [build:load-ui]
    requires:
      vars: [SERVER]
    vars:
      USERS: '{{.USERS | default "100"}}'
      STEP: '{{.STEP | default "100"}}'
      LEVELS: '{{.LEVELS | default "10"}}'
      FROM: '{{.FROM | default "1"}}'
      DURATION: '{{.DURATION | default "45s"}}'
      SPEED: '{{.SPEED | default "1"}}'
      REALISTIC: '{{.REALISTIC | default ""}}'
    cmds:
      - cargo build --release -p notekpr-load
      - ./target/release/notekpr-load --server {{.SERVER}} --open --users {{.USERS}} --step {{.STEP}} --levels {{.LEVELS}} --from-level {{.FROM}} --duration {{.DURATION}} --speed {{.SPEED}} {{if .REALISTIC}}--realistic{{end}} {{.CLI_ARGS}}

  load:native:
    desc: "Like load, without Docker: the server as a local process, no limits (USERS=100 STEP=100 LEVELS=10 FROM=1 DURATION=45s SPEED=1 REALISTIC=)"
    deps: [build:load-ui, build:web]
    vars:
      USERS: '{{.USERS | default "100"}}'
      STEP: '{{.STEP | default "100"}}'
      LEVELS: '{{.LEVELS | default "10"}}'
      FROM: '{{.FROM | default "1"}}'
      DURATION: '{{.DURATION | default "45s"}}'
      SPEED: '{{.SPEED | default "1"}}'
      REALISTIC: '{{.REALISTIC | default ""}}'
    cmds:
      - cargo build --release -p notekpr-server -p notekpr-load
      - ./target/release/notekpr-load --native --open --users {{.USERS}} --step {{.STEP}} --levels {{.LEVELS}} --from-level {{.FROM}} --duration {{.DURATION}} --speed {{.SPEED}} {{if .REALISTIC}}--realistic{{end}} {{.CLI_ARGS}}

  # ------------------------------------------------------------------ housekeeping

  clean:
    desc: Remove build outputs (keeps the dev database)
    cmds:
      - cargo clean
      - rm -rf {{.WEB_TARGET_DIR}} dist
