# Optional example: Traefik (its Kubernetes CRDs) in front of notekpr,
# next to deploy/kubernetes/notekpr.yaml. See docs/operations.md §4.
#
# * TLS: from the Secret notekpr-tls — made here by cert-manager (the
#   Certificate below; use your issuer), or whatever your Traefik already
#   does for TLS.
# * Client addresses: notekpr takes them from X-Forwarded-For
#   (NOTEKPR_TRUST_PROXY=true), for its per-person rate limits. Traefik
#   sets that header; its entry point must know the real client: trust the
#   forwarded headers or proxy protocol of whatever sits in front of it
#   (`forwardedHeaders.trustedIPs` / `proxyProtocol.trustedIPs`).
# * Long-lived WebSockets and large uploads: check the entry point's
#   `transport.respondingTimeouts` (readTimeout) against your largest
#   uploads — attachments up to max_attachment_mb, and snapshots of up to
#   4/3 of the snapshot limit (instance settings: docs/operations.md §4, §5).
# * /metrics is left out of the route: scrape it inside the cluster.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: notekpr-tls
  namespace: notekpr
spec:
  dnsNames:
    - notes.example.com
  secretName: notekpr-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: notekpr
  namespace: notekpr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`notes.example.com`) && !PathPrefix(`/metrics`)
      kind: Rule
      services:
        - name: notekpr
          port: 80
          # Optional: while an update runs the old and the new version side
          # by side (docs/operations.md §7), sticky sessions keep each
          # browser on the one it started with, so its changes aren't held
          # by the new one until the old one hands over. Not needed: only
          # one of them writes either way.
          # sticky:
          #   cookie:
          #     name: notekpr_server
          #     secure: true
          #     httpOnly: true
          #     sameSite: strict
  tls:
    secretName: notekpr-tls
